<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>DADU Explorer | Castlehold</title>
 <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
 <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
 <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
 <style>
 :root {
 --primary: #3A5566;
 --primary-dark: #2E4553;
 --accent: #CBB279;
 --accent-dark: #9A4A30;
 --orange: #e67e22;
 --orange-dark: #d35400;
 --teal: #7B746D;
 --cream: #F0EBE1;
 --white: #ffffff;
 --gray-100: #f8f9fa;
 --gray-200: #e9ecef;
 --gray-300: #dee2e6;
 --gray-400: #ced4da;
 --gray-500: #adb5bd;
 --gray-600: #6c757d;
 --gray-700: #495057;
 --gray-800: #343a40;
 --border: #e0e0e0;
 --shadow: 0 2px 8px rgba(0,0,0,0.1);
 }

 * { box-sizing: border-box; margin: 0; padding: 0; }

 body {
 font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
 background: var(--gray-100);
 color: var(--gray-800);
 overflow: hidden;
 }

 /* Main layout */
 .main-container {
 display: flex;
 height: calc(100vh - 75px);
 }

 /* Map section */
 .map-section {
 flex: 1;
 display: flex;
 flex-direction: column;
 }

 .map-toolbar {
 background: white;
 padding: 10px 15px;
 display: flex;
 align-items: center;
 gap: 10px;
 border-bottom: 1px solid var(--border);
 }

 .address-search {
 display: flex;
 align-items: center;
 background: var(--gray-100);
 border: 1px solid var(--border);
 border-radius: 4px;
 padding: 0 10px;
 flex: 1;
 max-width: 300px;
 }

 .address-search input {
 border: none;
 background: transparent;
 padding: 8px;
 font-size: 13px;
 font-family: inherit;
 width: 100%;
 outline: none;
 }

 .toolbar-btn {
 padding: 8px 14px;
 border: 1px solid var(--border);
 border-radius: 4px;
 font-size: 12px;
 font-weight: 600;
 font-family: inherit;
 cursor: pointer;
 display: flex;
 align-items: center;
 gap: 6px;
 background: white;
 color: var(--gray-700);
 transition: all 0.2s;
 }

 .toolbar-btn:hover {
 background: var(--gray-100);
 }

 .toolbar-btn.primary {
 background: var(--accent);
 color: white;
 border-color: var(--accent);
 }

 .toolbar-btn.primary:hover {
 background: var(--accent-dark);
 }

 #map {
 flex: 1;
 }

 /* Right panel */
 .right-panel {
 width: 420px;
 background: white;
 border-left: 1px solid var(--border);
 display: flex;
 flex-direction: column;
 overflow: hidden;
 }

 /* Search Criteria Header */
 .criteria-header {
 background: var(--accent);
 color: white;
 padding: 12px 16px;
 display: flex;
 align-items: center;
 justify-content: space-between;
 cursor: pointer;
 }

 .criteria-header h3 {
 font-size: 14px;
 font-weight: 700;
 display: flex;
 align-items: center;
 gap: 8px;
 }

 .criteria-toggle {
 font-size: 18px;
 transition: transform 0.2s;
 }

 .criteria-toggle.collapsed {
 transform: rotate(180deg);
 }

 /* Filter Form */
 .filter-form {
 padding: 16px;
 background: var(--gray-100);
 border-bottom: 1px solid var(--border);
 max-height: 400px;
 overflow-y: auto;
 transition: max-height 0.3s;
 }

 .filter-form.collapsed {
 max-height: 0;
 padding: 0 16px;
 overflow: hidden;
 }

 .filter-row {
 display: grid;
 grid-template-columns: repeat(2, 1fr);
 gap: 12px;
 margin-bottom: 12px;
 }

 .filter-row.full {
 grid-template-columns: 1fr;
 }

 .filter-row.triple {
 grid-template-columns: repeat(3, 1fr);
 }

 .filter-group {
 display: flex;
 flex-direction: column;
 gap: 4px;
 }

 .filter-group label {
 font-size: 11px;
 font-weight: 600;
 color: var(--gray-600);
 text-transform: uppercase;
 }

 .filter-group input,
 .filter-group select {
 padding: 8px 10px;
 border: 1px solid var(--border);
 border-radius: 4px;
 font-size: 13px;
 font-family: inherit;
 background: white;
 }

 .filter-group input:focus,
 .filter-group select:focus {
 outline: none;
 border-color: var(--accent);
 }

 .range-inputs {
 display: flex;
 gap: 6px;
 align-items: center;
 }

 .range-inputs input {
 flex: 1;
 min-width: 0;
 }

 .range-inputs span {
 color: var(--gray-500);
 font-size: 12px;
 }

 /* Results Header */
 .results-header {
 padding: 12px 16px;
 background: white;
 border-bottom: 1px solid var(--border);
 display: flex;
 align-items: center;
 justify-content: space-between;
 }

 .results-actions {
 display: flex;
 gap: 8px;
 align-items: center;
 }

 .results-actions button {
 padding: 6px 12px;
 border: 1px solid var(--border);
 border-radius: 4px;
 font-size: 11px;
 font-weight: 600;
 font-family: inherit;
 cursor: pointer;
 background: white;
 color: var(--gray-700);
 }

 .results-actions button:hover {
 background: var(--gray-100);
 }

 .results-actions button.primary {
 background: var(--accent);
 color: white;
 border-color: var(--accent);
 }

 .search-in-results {
 padding: 6px 10px;
 border: 1px solid var(--border);
 border-radius: 4px;
 font-size: 12px;
 font-family: inherit;
 width: 120px;
 }

 /* Results Grid */
 .results-grid {
 flex: 1;
 overflow-y: auto;
 padding: 12px;
 display: grid;
 grid-template-columns: 1fr;
 gap: 12px;
 }

 .property-card {
 background: white;
 border: 1px solid var(--border);
 border-radius: 8px;
 overflow: hidden;
 display: flex;
 cursor: pointer;
 transition: all 0.2s;
 }

 .property-card:hover {
 box-shadow: var(--shadow);
 border-color: var(--accent);
 }

 .property-card.selected {
 border-color: var(--accent);
 box-shadow: 0 0 0 2px rgba(181, 90, 60, 0.2);
 }

 .card-image {
 width: 140px;
 height: 110px;
 background: var(--gray-200);
 flex-shrink: 0;
 position: relative;
 overflow: hidden;
 }

 .card-image img {
 width: 100%;
 height: 100%;
 object-fit: cover;
 }

 .card-image .placeholder {
 width: 100%;
 height: 100%;
 display: flex;
 align-items: center;
 justify-content: center;
 font-size: 32px;
 color: var(--gray-400);
 }

 .card-checkbox {
 position: absolute;
 top: 8px;
 left: 8px;
 width: 18px;
 height: 18px;
 }

 .card-content {
 flex: 1;
 padding: 10px 12px;
 display: flex;
 flex-direction: column;
 }

 .card-address {
 font-size: 13px;
 font-weight: 700;
 color: var(--primary);
 margin-bottom: 2px;
 }

 .card-city {
 font-size: 11px;
 color: var(--gray-600);
 margin-bottom: 6px;
 }

 .card-type {
 font-size: 11px;
 color: var(--gray-600);
 margin-bottom: 4px;
 }

 .card-details {
 font-size: 11px;
 color: var(--gray-700);
 margin-bottom: 4px;
 }

 .card-dadu {
 font-size: 11px;
 font-weight: 600;
 margin-bottom: 4px;
 }

 .card-dadu.eligible { color: var(--accent); }
 .card-dadu.conditional { color: var(--orange); }
 .card-dadu.not-eligible { color: #c0392b; }

 .card-sale {
 font-size: 10px;
 color: var(--gray-500);
 margin-bottom: 6px;
 }

 .card-link {
 font-size: 11px;
 color: var(--teal);
 text-decoration: none;
 font-weight: 600;
 }

 .card-link:hover {
 text-decoration: underline;
 }

 /* Map marker styles */
 .marker-cluster-small,
 .marker-cluster-medium,
 .marker-cluster-large {
 background-color: rgba(181, 90, 60, 0.6);
 }

 .marker-cluster-small div,
 .marker-cluster-medium div,
 .marker-cluster-large div {
 background-color: rgba(181, 90, 60, 0.9);
 color: white;
 font-weight: 700;
 }

 /* No results */
 .no-results {
 text-align: center;
 padding: 40px 20px;
 color: var(--gray-500);
 }

 .no-results h3 {
 font-size: 16px;
 margin-bottom: 8px;
 color: var(--gray-600);
 }

 /* Loading */
 .loading-overlay {
 position: absolute;
 top: 0;
 left: 0;
 right: 0;
 bottom: 0;
 background: rgba(255,255,255,0.9);
 display: flex;
 align-items: center;
 justify-content: center;
 z-index: 1000;
 }

 .loading-overlay.hidden { display: none; }

 .spinner {
 width: 40px;
 height: 40px;
 border: 3px solid var(--gray-200);
 border-top-color: var(--accent);
 border-radius: 50%;
 animation: spin 1s linear infinite;
 }

 @keyframes spin {
 to { transform: rotate(360deg); }
 }

 /* Results count */
 .results-count {
 font-size: 12px;
 color: var(--gray-600);
 }

 .results-count strong {
 color: var(--primary);
 }</style>

<body>

<div id="site-header"></div>

 <div class="tabs-bar">

 <div class="main-container">
 <!-- Map Section -->
 <div class="map-section">
 <div class="map-toolbar">
 <div class="address-search">
 <span></span>
 <input type="text" id="address-input" placeholder="Enter address to locate"></div>
 <button class="toolbar-btn" onclick="drawShape()">
 <span>&#9634;</span>Draw Area</button>
 <button class="toolbar-btn" onclick="clearFilters()">

 <span></span>Search</button></div>

 <div class="filter-form" id="filter-form">

 <option value="SP">SP - Specific Plan</option></select></div></div></div>

 <!-- Results Header -->
 <div class="results-header">
 <div class="results-count">
 <span id="results-count">0</span>properties found</div>
 <div class="results-actions">
 <button onclick="selectAll()">Select All</button>
 <button onclick="exportCSV()">CSV</button>
 <button class="primary" onclick="runSearch()">New Search</button></div></div>

 <!-- Results Grid -->
 <div class="results-grid" id="results-grid">
 <div class="no-results">
 <h3>Enter search criteria</h3>
 <p>Use the filters above or zoom into the map to find properties</p></div></div>

 <!-- Loading -->
 <div class="loading-overlay hidden" id="loading">
 <div class="spinner"></div></div></div></div>

 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
 <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
 <script>
 // Services
 const SERVICES = {
 eligibility: 'https://services3.arcgis.com/58WV6GqBWodG9Kll/arcgis/rest/services/Eligibility_Enhanced_Polygons_20260213_065606/FeatureServer/0',
 buildingSpecs: 'https://services3.arcgis.com/58WV6GqBWodG9Kll/arcgis/rest/services/Building_Specs_Polygons_20260213_065606/FeatureServer/0'
 };

 // State
 let map;
 let markerCluster;
 let results = [];
 let selectedCards = new Set();

 // Initialize
 function init() {
 // Create map
 map = L.map('map').setView([36.1627, -86.7816], 11);

 L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
 attribution: '&copy; OpenStreetMap &copy; CARTO',
 maxZoom: 19
 }).addTo(map);

 // Marker cluster
 markerCluster = L.markerClusterGroup({
 maxClusterRadius: 50,
 disableClusteringAtZoom: 16,
 iconCreateFunction: function(cluster) {
 const count = cluster.getChildCount();
 return L.divIcon({
 html: '<div>' + count + '</div>',
 className: 'marker-cluster marker-cluster-medium',
 iconSize: [40, 40]
 });
 }
 });
 map.addLayer(markerCluster);

 // Map events
 map.on('moveend', onMapMove);

 // Enter key on address search
 document.getElementById('address-input').addEventListener('keypress', (e) =>{
 if (e.key === 'Enter') searchAddress();
 });
 }

 // Toggle criteria panel
 function toggleCriteria() {
 const form = document.getElementById('filter-form');
 const toggle = document.getElementById('criteria-toggle');
 form.classList.toggle('collapsed');
 toggle.classList.toggle('collapsed');
 }

 // Map move - auto search
 let moveTimeout;
 function onMapMove() {
 clearTimeout(moveTimeout);
 moveTimeout = setTimeout(() =>{
 if (map.getZoom() >= 14) {
 runSearch();
 }
 }, 500);
 }

 // Run search
 async function runSearch() {
 const loading = document.getElementById('loading');
 loading.classList.remove('hidden');

 try {
 const bounds = map.getBounds();
 const filters = getFilters();

 // Build WHERE clause
 let whereParts = [];

 // Bounds filter using Lat/Lon
 whereParts.push(`Lat >= ${bounds.getSouth()} AND Lat <= ${bounds.getNorth()}`);
 whereParts.push(`Lon >= ${bounds.getWest()} AND Lon <= ${bounds.getEast()}`);

 // Eligibility filter
 if (filters.eligibility === 'eligible') {
 whereParts.push("Eligibility_Status = 'CHECK_SP_USD'");
 } else if (filters.eligibility === 'conditional') {
 whereParts.push("(Eligibility_Status = 'GSD_NEEDS_OVERLAY' OR Eligibility_Status = 'CHECK_SP_GSD')");
 } else if (filters.eligibility === 'not-eligible') {
 whereParts.push("(Eligibility_Status = 'NOT_ELIGIBLE' OR Eligibility_Status = 'REVIEW_REQUIRED')");
 }

 // District filter
 if (filters.district === 'USD') {
 whereParts.push("In_USD = 1");
 } else if (filters.district === 'GSD') {
 whereParts.push("In_USD = 0");
 }

 // Zoning filter
 if (filters.zoning) {
 whereParts.push(`Zoning LIKE '${filters.zoning}%'`);
 }

 // Lot size filter
 if (filters.lotMin) {
 whereParts.push(`Lot_SqFt >= ${filters.lotMin}`);
 }
 if (filters.lotMax) {
 whereParts.push(`Lot_SqFt <= ${filters.lotMax}`);
 }

 const whereClause = whereParts.join(' AND ');

 // Query
 const params = new URLSearchParams({
 where: whereClause,
 outFields: 'STANPAR,Address,Zoning,Eligibility_Status,Lot_SqFt,Acres,In_USD,Service_District,Max_DADU_Living_SF,Lat,Lon',
 returnGeometry: false,
 f: 'json',
 resultRecordCount: 200
 });

 const response = await fetch(`${SERVICES.eligibility}/query?${params}`);
 const data = await response.json();

 results = data.features ? data.features.map(f =>f.attributes) : [];

 // Update UI
 updateResults();
 updateMarkers();

 } catch (err) {
 console.error('Search error:', err);
 } finally {
 loading.classList.add('hidden');
 }
 }

 // Get filter values
 function getFilters() {
 return {
 zip: document.getElementById('filter-zip').value.trim(),
 district: document.getElementById('filter-district').value,
 type: document.getElementById('filter-type').value,
 eligibility: document.getElementById('filter-eligibility').value,
 lotMin: document.getElementById('filter-lot-min').value,
 lotMax: document.getElementById('filter-lot-max').value,
 sqftMin: document.getElementById('filter-sqft-min').value,
 sqftMax: document.getElementById('filter-sqft-max').value,
 yearMin: document.getElementById('filter-year-min').value,
 yearMax: document.getElementById('filter-year-max').value,
 priceMin: document.getElementById('filter-price-min').value,
 priceMax: document.getElementById('filter-price-max').value,
 stories: document.getElementById('filter-stories').value,
 zoning: document.getElementById('filter-zoning').value
 };
 }

 // Update results panel
 function updateResults() {
 const grid = document.getElementById('results-grid');
 const count = document.getElementById('results-count');

 count.textContent = results.length;

 if (results.length === 0) {
 grid.innerHTML = `
 <div class="no-results">
 <h3>No properties found</h3>
 <p>Try adjusting your filters or zoom to a different area</p></div>
 `;
 return;
 }

 grid.innerHTML = results.map((prop, idx) =>{
 const eligStatus = getEligibilityClass(prop.Eligibility_Status);
 const eligLabel = getEligibilityLabel(prop.Eligibility_Status);
 const lotSf = prop.Lot_SqFt || Math.round((prop.Acres || 0) * 43560);
 const maxDadu = prop.Max_DADU_Living_SF || calculateMaxDadu(lotSf);

 // Street View thumbnail URL
 const streetViewUrl = prop.Lat && prop.Lon
 ? `https://maps.googleapis.com/maps/api/streetview?size=280x220&location=${prop.Lat},${prop.Lon}&key=YOUR_API_KEY`
 : '';

 return `
 <div class="property-card" data-idx="${idx}" onclick="selectProperty(${idx})">
 <div class="card-image">
 <input type="checkbox" class="card-checkbox" onclick="event.stopPropagation(); toggleSelect(${idx})">
 <div class="placeholder"></div></div>
 <div class="card-content">
 <div class="card-address">${prop.Address || 'Unknown Address'}</div>
 <div class="card-city">NASHVILLE TN</div>
 <div class="card-type">Single Family Residence</div>
 <div class="card-details">${lotSf ? lotSf.toLocaleString() + ' sqft lot' : ''}</div>
 <div class="card-dadu ${eligStatus}">DADU: ${eligLabel} (Max ${maxDadu} SF)</div>
 <div class="card-details">Zoning: ${prop.Zoning || 'N/A'}</div>
 <a href="property-report-card.html?apn=${prop.STANPAR}&address=${encodeURIComponent(prop.Address || '')}" class="card-link" onclick="event.stopPropagation()">View Property Report</a></div></div>
 `;
 }).join('');
 }

 // Update map markers
 function updateMarkers() {
 markerCluster.clearLayers();

 results.forEach((prop, idx) =>{
 if (!prop.Lat || !prop.Lon) return;

 const eligStatus = getEligibilityClass(prop.Eligibility_Status);
 const color = eligStatus === 'eligible' ? '#CBB279' :
 eligStatus === 'conditional' ? '#f39c12' : '#c0392b';

 const marker = L.circleMarker([prop.Lat, prop.Lon], {
 radius: 8,
 fillColor: color,
 color: '#fff',
 weight: 2,
 fillOpacity: 0.9
 });

 marker.bindPopup(`
 <strong>${prop.Address || 'Unknown'}</strong><br>
 ${prop.Zoning || ''}<br>
 <a href="property-report-card.html?apn=${prop.STANPAR}">View Report</a>
 `);

 marker.on('click', () =>{
 selectProperty(idx);
 highlightCard(idx);
 });

 markerCluster.addLayer(marker);
 });
 }

 // Select property
 function selectProperty(idx) {
 const prop = results[idx];
 if (!prop || !prop.Lat || !prop.Lon) return;

 map.setView([prop.Lat, prop.Lon], 17);

 // Highlight card
 highlightCard(idx);
 }

 // Highlight card
 function highlightCard(idx) {
 document.querySelectorAll('.property-card').forEach(card =>{
 card.classList.remove('selected');
 });

 const card = document.querySelector(`.property-card[data-idx="${idx}"]`);
 if (card) {
 card.classList.add('selected');
 card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
 }
 }

 // Toggle select
 function toggleSelect(idx) {
 if (selectedCards.has(idx)) {
 selectedCards.delete(idx);
 } else {
 selectedCards.add(idx);
 }
 }

 // Select all
 function selectAll() {
 const checkboxes = document.querySelectorAll('.card-checkbox');
 const allSelected = selectedCards.size === results.length;

 checkboxes.forEach((cb, idx) =>{
 cb.checked = !allSelected;
 if (!allSelected) {
 selectedCards.add(idx);
 } else {
 selectedCards.delete(idx);
 }
 });
 }

 // Export CSV
 function exportCSV() {
 if (results.length === 0) return;

 const headers = ['Address', 'APN', 'Zoning', 'Lot_SqFt', 'Eligibility', 'Max_DADU_SF'];
 const rows = results.map(p =>[
 p.Address || '',
 p.STANPAR || '',
 p.Zoning || '',
 p.Lot_SqFt || '',
 p.Eligibility_Status || '',
 p.Max_DADU_Living_SF || ''
 ]);

 const csv = [headers.join(','), ...rows.map(r =>r.map(c =>`"${c}"`).join(','))].join('\n');
 const blob = new Blob([csv], { type: 'text/csv' });
 const url = URL.createObjectURL(blob);

 const a = document.createElement('a');
 a.href = url;
 a.download = 'dadu_properties.csv';
 a.click();
 }

 // Clear filters
 function clearFilters() {
 document.querySelectorAll('.filter-form input, .filter-form select').forEach(el =>{
 if (el.tagName === 'SELECT') {
 el.selectedIndex = 0;
 } else {
 el.value = '';
 }
 });
 }

 // Search address
 async function searchAddress() {
 const address = document.getElementById('address-input').value.trim();
 if (!address) return;

 try {
 // Try eligibility service first
 const params = new URLSearchParams({
 where: `Address LIKE '%${address.toUpperCase().replace(/'/g, "''")}%'`,
 outFields: 'Lat,Lon',
 returnGeometry: false,
 f: 'json',
 resultRecordCount: 1
 });

 const response = await fetch(`${SERVICES.eligibility}/query?${params}`);
 const data = await response.json();

 if (data.features && data.features.length >0) {
 const { Lat, Lon } = data.features[0].attributes;
 if (Lat && Lon) {
 map.setView([Lat, Lon], 17);
 return;
 }
 }

 // Fallback 1: Esri World Geocoder
 let lat = null, lon = null;
 try {
 const esriUrl = `https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?SingleLine=${encodeURIComponent(address + ', Nashville, TN')}&f=json&outFields=Match_addr&maxLocations=1`;
 const esriResp = await fetch(esriUrl);
 const esriData = await esriResp.json();
 if (esriData.candidates && esriData.candidates.length > 0) {
 lat = esriData.candidates[0].location.y;
 lon = esriData.candidates[0].location.x;
 }
 } catch (e) { console.log('Esri geocoder failed'); }

 // Fallback 2: Nominatim
 if (!lat || !lon) {
 try {
 const geoUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address + ', Nashville, TN')}`;
 const geoResponse = await fetch(geoUrl);
 const geoResults = await geoResponse.json();
 if (geoResults && geoResults.length > 0) {
 lat = parseFloat(geoResults[0].lat);
 lon = parseFloat(geoResults[0].lon);
 }
 } catch (e) { console.log('Nominatim failed'); }
 }

 if (lat && lon) {
 map.setView([lat, lon], 17);
 }
 } catch (err) {
 console.error('Address search error:', err);
 }
 }

 window.location.href = 'dadu_eligibility_map.html';

 // Helper functions
 function getEligibilityClass(status) {
 if (status === 'CHECK_SP_USD') return 'eligible';
 if (status === 'GSD_NEEDS_OVERLAY' || status === 'CHECK_SP_GSD') return 'conditional';
 return 'not-eligible';
 }

 function getEligibilityLabel(status) {
 if (status === 'CHECK_SP_USD') return 'Eligible';
 if (status === 'GSD_NEEDS_OVERLAY' || status === 'CHECK_SP_GSD') return 'Conditional';
 return 'Not Eligible';
 }

 function calculateMaxDadu(lotSf) {
 if (lotSf >= 43560) return 1200;
 if (lotSf >= 20000) return 900;
 if (lotSf >= 10000) return 850;
 return 700;
 }
