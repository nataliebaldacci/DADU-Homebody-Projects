<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 40 36">
  <!-- House body -->
  <rect fill="#3A5566" x="1" y="14" width="20" height="18" rx="0.5"/>
  <!-- House roof -->
  <polygon fill="#3A5566" points="0,14.5 11,4 22,14.5"/>
  <!-- Chimney -->
  <rect fill="#3A5566" x="4" y="5.5" width="3" height="6"/>
  <!-- Roof ridge line (lighter) -->
  <polygon fill="#4C5C66" points="11,4.5 22,14.5 11,14.5"/>
  <!-- Windows -->
  <rect fill="#F5F5F0" x="4" y="17" width="5.5" height="4.5" rx="0.3"/>
  <rect fill="#F5F5F0" x="12" y="17" width="5.5" height="4.5" rx="0.3"/>
  <!-- Door -->
  <rect fill="#F5F5F0" x="7.5" y="24" width="5" height="8" rx="0.3"/>

  <!-- Checklist document (overlapping house on right, Project_Checklist v4 style) -->
  <g transform="translate(15, 8)">
    <!-- Document background -->
    <rect fill="#3A5566" x="0" y="0" width="19" height="24" rx="1.2"/>
    <rect fill="#F5F5F0" x="1.5" y="1.5" width="16" height="21" rx="0.5"/>

    <!-- Check 1 + dot row -->
    <g>
      <polyline fill="none" stroke="#3A5566" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" points="3.5,5 4.8,6.3 6.5,3.8"/>
      <circle fill="#7B746D" cx="9" cy="5" r="0.55"/>
      <circle fill="#7B746D" cx="10.8" cy="5" r="0.45"/>
      <circle fill="#7B746D" cx="12.3" cy="5" r="0.38"/>
      <circle fill="#7B746D" cx="13.6" cy="5" r="0.3"/>
    </g>
    <!-- Check 2 + dot row -->
    <g>
      <polyline fill="none" stroke="#3A5566" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" points="3.5,10 4.8,11.3 6.5,8.8"/>
      <circle fill="#7B746D" cx="9" cy="10" r="0.55"/>
      <circle fill="#7B746D" cx="10.8" cy="10" r="0.45"/>
      <circle fill="#7B746D" cx="12.3" cy="10" r="0.38"/>
    </g>
    <!-- Unchecked 3 + dot row -->
    <g>
      <rect fill="none" stroke="#3A5566" stroke-width="0.9" x="3.5" y="13.5" width="3" height="3" rx="0.4"/>
      <circle fill="#7B746D" cx="9" cy="15" r="0.55"/>
      <circle fill="#7B746D" cx="10.8" cy="15" r="0.45"/>
      <circle fill="#7B746D" cx="12.3" cy="15" r="0.38"/>
      <circle fill="#7B746D" cx="13.6" cy="15" r="0.3"/>
    </g>
  </g>

  <!-- Stamp (bottom right, overlapping checklist) -->
  <g transform="translate(24, 20)">
    <!-- Stamp base -->
    <rect fill="#7B746D" x="0" y="5.5" width="8" height="2" rx="0.4"/>
    <!-- Stamp neck -->
    <rect fill="#7B746D" x="2" y="3" width="4" height="3" rx="0.3"/>
    <!-- Stamp handle -->
    <rect fill="#3A5566" x="1" y="1" width="6" height="2.5" rx="1"/>
  </g>
</svg>
