<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- Vertical timeline line -->
    <g>
      <rect fill="#3A5566" x="5.5" y="1" width="2" height="26" rx="0.5"/>
    </g>
    <!-- Timeline node 1 (top) -->
    <g>
      <circle fill="#3A5566" cx="6.5" cy="5" r="3"/>
      <circle fill="#F5F5F0" cx="6.5" cy="5" r="1.5"/>
    </g>
    <!-- Text lines for node 1 -->
    <g>
      <rect fill="#3A5566" x="12" y="3.5" width="10" height="1.5" rx="0.3"/>
      <rect fill="#7B746D" x="12" y="6" width="7" height="1" rx="0.2"/>
    </g>
    <!-- Timeline node 2 (middle) -->
    <g>
      <circle fill="#3A5566" cx="6.5" cy="14" r="3"/>
      <circle fill="#F5F5F0" cx="6.5" cy="14" r="1.5"/>
    </g>
    <!-- Text lines + dots for node 2 -->
    <g>
      <rect fill="#3A5566" x="12" y="12.5" width="11" height="1.5" rx="0.3"/>
      <!-- Dot detail replacing text subtitle -->
      <circle fill="#7B746D" cx="12.5" cy="15.5" r="0.45"/>
      <circle fill="#7B746D" cx="14.5" cy="15.5" r="0.45"/>
      <circle fill="#7B746D" cx="16.5" cy="15.5" r="0.4"/>
      <circle fill="#7B746D" cx="18.5" cy="15.5" r="0.35"/>
    </g>
    <!-- Timeline node 3 (bottom) -->
    <g>
      <circle fill="#3A5566" cx="6.5" cy="23" r="3"/>
      <circle fill="#F5F5F0" cx="6.5" cy="23" r="1.5"/>
    </g>
    <!-- Text lines for node 3 -->
    <g>
      <rect fill="#3A5566" x="12" y="21.5" width="8" height="1.5" rx="0.3"/>
      <rect fill="#7B746D" x="12" y="24" width="6" height="1" rx="0.2"/>
    </g>
  </g>
</svg>