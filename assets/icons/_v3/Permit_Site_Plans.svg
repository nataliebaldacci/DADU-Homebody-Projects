<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- Blueprint/document -->
    <g>
      <rect fill="#3A5566" x="2" y="1" width="24" height="26" rx="1.2"/>
      <rect fill="#F5F5F0" x="4" y="3" width="20" height="22" rx="0.5"/>
    </g>
    <!-- Site plan lines (building outline) -->
    <g>
      <rect fill="none" stroke="#3A5566" stroke-width="1.2" x="7" y="6" width="10" height="8" rx="0.3"/>
      <rect fill="none" stroke="#3A5566" stroke-width="0.8" x="9" y="8" width="4" height="4" rx="0.2"/>
    </g>
    <!-- Dimension line -->
    <g>
      <line stroke="#3A5566" stroke-width="0.6" x1="7" y1="17" x2="17" y2="17"/>
      <line stroke="#3A5566" stroke-width="0.6" x1="7" y1="16" x2="7" y2="18"/>
      <line stroke="#3A5566" stroke-width="0.6" x1="17" y1="16" x2="17" y2="18"/>
    </g>
    <!-- Dots inside as survey points -->
    <g>
      <circle fill="#7B746D" cx="7" cy="6" r="0.6"/>
      <circle fill="#7B746D" cx="17" cy="6" r="0.6"/>
      <circle fill="#7B746D" cx="7" cy="14" r="0.6"/>
      <circle fill="#7B746D" cx="17" cy="14" r="0.6"/>
      <circle fill="#7B746D" cx="20" cy="8" r="0.45"/>
      <circle fill="#7B746D" cx="20" cy="11" r="0.4"/>
    </g>
    <!-- Text lines -->
    <g>
      <rect fill="#3A5566" x="6" y="20" width="8" height="1" rx="0.2" opacity="0.5"/>
      <rect fill="#3A5566" x="6" y="22.5" width="6" height="1" rx="0.2" opacity="0.5"/>
    </g>
  </g>
</svg>