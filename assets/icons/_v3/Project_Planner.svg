<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- Frame -->
    <g>
      <rect fill="#3A5566" x="1" y="1" width="26" height="26" rx="1.5"/>
      <rect fill="#F5F5F0" x="3" y="3" width="22" height="22" rx="0.5"/>
    </g>
    <!-- Gantt bars -->
    <g>
      <rect fill="#3A5566" x="5" y="5.5" width="12" height="3" rx="0.5"/>
      <rect fill="#3A5566" x="9" y="10.5" width="10" height="3" rx="0.5"/>
      <rect fill="#3A5566" x="7" y="15.5" width="14" height="3" rx="0.5"/>
    </g>
    <!-- Dots at bar endpoints (milestones) -->
    <g>
      <circle fill="#7B746D" cx="18.5" cy="7" r="0.7"/>
      <circle fill="#7B746D" cx="20.5" cy="12" r="0.7"/>
      <circle fill="#7B746D" cx="22.5" cy="17" r="0.7"/>
    </g>
    <!-- Dots in empty area below -->
    <g>
      <circle fill="#7B746D" cx="6" cy="21.5" r="0.45"/>
      <circle fill="#7B746D" cx="9" cy="21.5" r="0.45"/>
      <circle fill="#7B746D" cx="12" cy="21.5" r="0.4"/>
    </g>
  </g>
</svg>