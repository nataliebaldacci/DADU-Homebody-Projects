<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- Document -->
    <g>
      <rect fill="#3A5566" x="2" y="1" width="18" height="24" rx="1"/>
      <rect fill="#F5F5F0" x="3.5" y="2.5" width="15" height="21" rx="0.4"/>
    </g>
    <!-- Text lines on document -->
    <g>
      <rect fill="#3A5566" x="5.5" y="4.5" width="10" height="1.3" rx="0.3"/>
      <rect fill="#3A5566" x="5.5" y="7.5" width="8" height="1" rx="0.2" opacity="0.5"/>
      <rect fill="#3A5566" x="5.5" y="10" width="9" height="1" rx="0.2" opacity="0.5"/>
    </g>
    <!-- Approval stamp circle (bottom-right of document) -->
    <g>
      <circle fill="#3A5566" cx="20" cy="19" r="6.5"/>
      <circle fill="#F5F5F0" cx="20" cy="19" r="5"/>
      <circle fill="none" stroke="#3A5566" stroke-width="0.6" cx="20" cy="19" r="3.8"/>
      <!-- Dots inside stamp as texture -->
      <circle fill="#7B746D" cx="18.5" cy="17.5" r="0.4"/>
      <circle fill="#7B746D" cx="20" cy="17.5" r="0.4"/>
      <circle fill="#7B746D" cx="21.5" cy="17.5" r="0.4"/>
      <circle fill="#7B746D" cx="18.5" cy="19" r="0.4"/>
      <circle fill="#7B746D" cx="20" cy="19" r="0.4"/>
      <circle fill="#7B746D" cx="21.5" cy="19" r="0.4"/>
      <circle fill="#7B746D" cx="18.5" cy="20.5" r="0.35"/>
      <circle fill="#7B746D" cx="20" cy="20.5" r="0.35"/>
      <circle fill="#7B746D" cx="21.5" cy="20.5" r="0.35"/>
    </g>
  </g>
</svg>