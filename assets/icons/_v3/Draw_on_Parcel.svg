<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- Paper/canvas -->
    <g>
      <rect fill="#3A5566" x="1" y="1" width="20" height="26" rx="1"/>
      <rect fill="#F5F5F0" x="2.5" y="2.5" width="17" height="23" rx="0.4"/>
    </g>
    <!-- Grid dots inside canvas -->
    <g>
      <circle fill="#7B746D" cx="5" cy="5" r="0.4"/>
      <circle fill="#7B746D" cx="8.5" cy="5" r="0.4"/>
      <circle fill="#7B746D" cx="12" cy="5" r="0.4"/>
      <circle fill="#7B746D" cx="15.5" cy="5" r="0.4"/>
      <circle fill="#7B746D" cx="5" cy="8.5" r="0.4"/>
      <circle fill="#7B746D" cx="15.5" cy="8.5" r="0.4"/>
      <circle fill="#7B746D" cx="5" cy="12" r="0.4"/>
      <circle fill="#7B746D" cx="15.5" cy="12" r="0.4"/>
      <circle fill="#7B746D" cx="5" cy="22" r="0.4"/>
      <circle fill="#7B746D" cx="8.5" cy="22" r="0.4"/>
      <circle fill="#7B746D" cx="12" cy="22" r="0.4"/>
      <circle fill="#7B746D" cx="15.5" cy="22" r="0.4"/>
    </g>
    <!-- Building outline drawn on grid -->
    <g>
      <rect fill="none" stroke="#3A5566" stroke-width="1.2" x="6.5" y="10" width="8" height="10" rx="0.3"/>
      <rect fill="none" stroke="#3A5566" stroke-width="0.8" x="8.5" y="14" width="4" height="6"/>
    </g>
    <!-- Pencil -->
    <g>
      <rect fill="#3A5566" x="20" y="2" width="2.5" height="12" rx="0.5" transform="rotate(15,21.3,8)"/>
      <polygon fill="#3A5566" points="22,16 24.5,19 19.5,19" transform="rotate(15,22,17.5)"/>
    </g>
  </g>
</svg>