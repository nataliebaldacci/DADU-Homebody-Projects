    <!-- Dots inside house (flanking the person) -->
    <g>
      <circle fill="#7B746D" cx="8" cy="17" r="0.5"/>
      <circle fill="#7B746D" cx="8" cy="19.5" r="0.45"/>
      <circle fill="#7B746D" cx="8" cy="22" r="0.4"/>
      <circle fill="#7B746D" cx="20" cy="17" r="0.5"/>
      <circle fill="#7B746D" cx="20" cy="19.5" r="0.45"/>
      <circle fill="#7B746D" cx="20" cy="22" r="0.4"/>
    </g>
