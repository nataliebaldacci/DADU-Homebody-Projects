<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- House -->
    <g>
      <polygon fill="#3A5566" points="1,14 14,3 27,14"/>
      <rect fill="#3A5566" x="4" y="13" width="20" height="13" rx="0.5"/>
      <rect fill="#F5F5F0" x="6" y="14.5" width="16" height="10" rx="0.3"/>
    </g>
    <!-- Person silhouette inside -->
