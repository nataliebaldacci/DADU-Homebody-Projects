<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- House -->
    <g>
      <polygon fill="#3A5566" points="2,14 12,5 22,14"/>
      <rect fill="#3A5566" x="4.5" y="13" width="15" height="11" rx="0.5"/>
      <rect fill="#F5F5F0" x="6.5" y="14.5" width="11" height="8" rx="0.3"/>
    </g>
    <!-- Checkmark inside house -->
    <g>
      <polyline fill="none" stroke="#3A5566" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="9,18.5 11.5,21 15.5,15.5"/>
    </g>
    <!-- Magnifying glass overlay (top-right) -->
    <g>
      <circle fill="#F5F5F0" cx="21" cy="8" r="5.5" stroke="#3A5566" stroke-width="2"/>
      <!-- Dots inside magnifying glass -->
      <circle fill="#7B746D" cx="19.5" cy="6.5" r="0.5"/>
      <circle fill="#7B746D" cx="21" cy="6.5" r="0.5"/>
      <circle fill="#7B746D" cx="22.5" cy="6.5" r="0.5"/>
      <circle fill="#7B746D" cx="19.5" cy="8" r="0.5"/>
      <circle fill="#7B746D" cx="21" cy="8" r="0.5"/>
      <circle fill="#7B746D" cx="22.5" cy="8" r="0.5"/>
      <circle fill="#7B746D" cx="19.5" cy="9.5" r="0.4"/>
      <circle fill="#7B746D" cx="21" cy="9.5" r="0.4"/>
      <circle fill="#7B746D" cx="22.5" cy="9.5" r="0.4"/>
      <!-- Handle -->
      <rect fill="#3A5566" x="24.5" y="12" width="2.5" height="6" rx="1" transform="rotate(-45,25.8,15)"/>
    </g>
  </g>
</svg>