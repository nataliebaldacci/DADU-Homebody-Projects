<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- Chart frame -->
    <g>
      <rect fill="#3A5566" x="1" y="1" width="26" height="26" rx="1.5"/>
      <rect fill="#F5F5F0" x="3" y="3" width="22" height="22" rx="0.5"/>
    </g>
    <!-- Activity line (zigzag) -->
    <g>
      <polyline fill="none" stroke="#3A5566" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" points="5,18 9,10 12,16 16,7 20,13 23,8"/>
    </g>
    <!-- Dots at data points -->
    <g>
      <circle fill="#7B746D" cx="5" cy="18" r="0.7"/>
      <circle fill="#7B746D" cx="9" cy="10" r="0.7"/>
      <circle fill="#7B746D" cx="12" cy="16" r="0.7"/>
      <circle fill="#7B746D" cx="16" cy="7" r="0.7"/>
      <circle fill="#7B746D" cx="20" cy="13" r="0.7"/>
      <circle fill="#7B746D" cx="23" cy="8" r="0.7"/>
    </g>
    <!-- Axis -->
    <g>
      <rect fill="#3A5566" x="4" y="21" width="19" height="0.8" rx="0.2" opacity="0.3"/>
    </g>
  </g>
</svg>