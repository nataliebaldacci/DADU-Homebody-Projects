<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- Back layer -->
    <g>
      <rect fill="#7B746D" x="6" y="1" width="20" height="16" rx="1" opacity="0.4"/>
    </g>
    <!-- Middle layer -->
    <g>
      <rect fill="#3A5566" x="3" y="4" width="20" height="16" rx="1" opacity="0.6"/>
    </g>
    <!-- Front layer (main) -->
    <g>
      <rect fill="#3A5566" x="1" y="8" width="20" height="18" rx="1"/>
      <rect fill="#F5F5F0" x="2.5" y="9.5" width="17" height="15" rx="0.4"/>
    </g>
    <!-- Ruler marks on front layer -->
    <g>
      <rect fill="#3A5566" x="4" y="11" width="0.8" height="4" rx="0.2"/>
      <rect fill="#3A5566" x="4" y="16" width="0.8" height="3" rx="0.2"/>
      <rect fill="#3A5566" x="4" y="20" width="0.8" height="2.5" rx="0.2"/>
    </g>
    <!-- Dot grid inside front panel -->
    <g>
      <circle fill="#7B746D" cx="10" cy="13" r="0.5"/>
      <circle fill="#7B746D" cx="13" cy="13" r="0.5"/>
      <circle fill="#7B746D" cx="16" cy="13" r="0.5"/>
      <circle fill="#7B746D" cx="10" cy="16" r="0.45"/>
      <circle fill="#7B746D" cx="13" cy="16" r="0.45"/>
      <circle fill="#7B746D" cx="16" cy="16" r="0.45"/>
      <circle fill="#7B746D" cx="10" cy="19" r="0.4"/>
      <circle fill="#7B746D" cx="13" cy="19" r="0.4"/>
      <circle fill="#7B746D" cx="16" cy="19" r="0.4"/>
    </g>
  </g>
</svg>