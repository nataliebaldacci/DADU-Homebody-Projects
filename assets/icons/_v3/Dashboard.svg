      <rect fill="#F5F5F0" x="16" y="15.5" width="6.5" height="6" rx="0.3"/>
      <rect fill="#3A5566" x="17" y="16.5" width="4.5" height="1.5" rx="0.3"/>
      <rect fill="#3A5566" x="17" y="19" width="3" height="1" rx="0.2" opacity="0.5"/>
