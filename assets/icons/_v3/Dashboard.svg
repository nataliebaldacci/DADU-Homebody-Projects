<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- Outer frame -->
    <g>
      <rect fill="#3A5566" x="1" y="1" width="26" height="26" rx="2"/>
      <rect fill="#F5F5F0" x="2.5" y="2.5" width="23" height="23" rx="1"/>
    </g>
    <!-- Top-left panel: bar chart -->
    <g>
      <rect fill="#3A5566" x="4" y="4" width="9.5" height="9" rx="0.5"/>
      <rect fill="#F5F5F0" x="5.5" y="5.5" width="6.5" height="6" rx="0.3"/>
      <rect fill="#3A5566" x="6" y="8.5" width="1.5" height="3" rx="0.2"/>
      <rect fill="#3A5566" x="8.2" y="7" width="1.5" height="4.5" rx="0.2"/>
      <rect fill="#3A5566" x="10.4" y="6" width="1.5" height="5.5" rx="0.2"/>
    </g>
    <!-- Top-right panel: dot grid (dots as content) -->
    <g>
      <rect fill="#3A5566" x="14.5" y="4" width="9.5" height="9" rx="0.5"/>
      <rect fill="#F5F5F0" x="16" y="5.5" width="6.5" height="6" rx="0.3"/>
      <circle fill="#7B746D" cx="17.5" cy="7" r="0.6"/>
      <circle fill="#7B746D" cx="19.3" cy="7" r="0.6"/>
      <circle fill="#7B746D" cx="21" cy="7" r="0.6"/>
      <circle fill="#7B746D" cx="17.5" cy="8.8" r="0.6"/>
      <circle fill="#7B746D" cx="19.3" cy="8.8" r="0.6"/>
      <circle fill="#7B746D" cx="21" cy="8.8" r="0.6"/>
      <circle fill="#7B746D" cx="17.5" cy="10.5" r="0.5"/>
      <circle fill="#7B746D" cx="19.3" cy="10.5" r="0.5"/>
      <circle fill="#7B746D" cx="21" cy="10.5" r="0.5"/>
    </g>
    <!-- Bottom-left panel: line chart -->
    <g>
      <rect fill="#3A5566" x="4" y="14" width="9.5" height="9" rx="0.5"/>
      <rect fill="#F5F5F0" x="5.5" y="15.5" width="6.5" height="6" rx="0.3"/>
      <polyline fill="none" stroke="#3A5566" stroke-width="1" stroke-linecap="round" points="6,20 8,17.5 10,19 11.5,16.5"/>
