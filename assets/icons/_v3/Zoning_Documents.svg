<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- Document frame -->
    <g>
      <rect fill="#3A5566" x="2" y="1" width="24" height="26" rx="1.2"/>
      <rect fill="#F5F5F0" x="4" y="3" width="20" height="22" rx="0.5"/>
    </g>
    <!-- Zoning grid (3x3) -->
    <g>
      <rect fill="#3A5566" x="6" y="5" width="5" height="5" rx="0.3"/>
      <rect fill="#3A5566" x="12.5" y="5" width="5" height="5" rx="0.3" opacity="0.6"/>
      <rect fill="#3A5566" x="6" y="11.5" width="5" height="5" rx="0.3" opacity="0.6"/>
      <rect fill="#3A5566" x="12.5" y="11.5" width="5" height="5" rx="0.3"/>
    </g>
    <!-- Dots inside grid cells -->
    <g>
      <circle fill="#F5F5F0" cx="8.5" cy="7.5" r="0.6"/>
      <circle fill="#F5F5F0" cx="15" cy="14" r="0.6"/>
    </g>
    <!-- Label below -->
    <g>
      <rect fill="#3A5566" x="6" y="19.5" width="10" height="1.2" rx="0.2" opacity="0.5"/>
      <circle fill="#7B746D" cx="6.5" cy="22.5" r="0.45"/>
      <circle fill="#7B746D" cx="9" cy="22.5" r="0.45"/>
      <circle fill="#7B746D" cx="11.5" cy="22.5" r="0.4"/>
    </g>
  </g>
</svg>