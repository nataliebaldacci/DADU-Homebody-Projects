<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- House -->
    <g>
      <polygon fill="#3A5566" points="1,14 14,3 27,14"/>
      <rect fill="#3A5566" x="4" y="13" width="20" height="13" rx="0.5"/>
      <rect fill="#F5F5F0" x="6" y="14.5" width="16" height="10" rx="0.3"/>
    </g>
    <!-- Door -->
    <g>
      <rect fill="#3A5566" x="11" y="18" width="6" height="6.5" rx="0.5"/>
      <circle fill="#F5F5F0" cx="15.5" cy="21.5" r="0.6"/>
    </g>
    <!-- Key icon (bottom-left, representing occupancy) -->
    <g>
      <circle fill="#3A5566" cx="8.5" cy="17.5" r="2" stroke="#F5F5F0" stroke-width="0"/>
      <circle fill="#F5F5F0" cx="8.5" cy="17.5" r="0.8"/>
      <!-- Dots inside as key teeth detail -->
      <circle fill="#7B746D" cx="8.5" cy="20" r="0.4"/>
      <circle fill="#7B746D" cx="8.5" cy="21.5" r="0.35"/>
      <circle fill="#7B746D" cx="8.5" cy="23" r="0.3"/>
    </g>
  </g>
</svg>