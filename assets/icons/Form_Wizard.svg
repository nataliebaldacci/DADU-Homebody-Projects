<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- Document/form -->
    <g>
      <rect fill="#3A5566" x="1" y="1" width="19" height="26" rx="1"/>
      <rect fill="#F5F5F0" x="2.5" y="2.5" width="16" height="23" rx="0.4"/>
    </g>
    <!-- Form field boxes (empty fields to fill in) -->
    <g>
      <!-- Label dot + field box 1 -->
      <circle fill="#7B746D" cx="5" cy="5.5" r="0.5"/>
      <circle fill="#7B746D" cx="6.8" cy="5.5" r="0.42"/>
      <rect fill="none" stroke="#3A5566" stroke-width="0.8" x="4.5" y="7" width="12" height="2.5" rx="0.3"/>
      <!-- Label dot + field box 2 -->
      <circle fill="#7B746D" cx="5" cy="11.5" r="0.5"/>
      <circle fill="#7B746D" cx="6.8" cy="11.5" r="0.42"/>
      <circle fill="#7B746D" cx="8.4" cy="11.5" r="0.35"/>
      <rect fill="none" stroke="#3A5566" stroke-width="0.8" x="4.5" y="13" width="12" height="2.5" rx="0.3"/>
      <!-- Label dot + field box 3 -->
      <circle fill="#7B746D" cx="5" cy="17.5" r="0.5"/>
      <circle fill="#7B746D" cx="6.8" cy="17.5" r="0.42"/>
      <rect fill="none" stroke="#3A5566" stroke-width="0.8" x="4.5" y="19" width="12" height="2.5" rx="0.3"/>
    </g>
    <!-- Magic wand / arrow (wizard indicator) -->
    <g>
      <!-- Wand body (diagonal) -->
      <rect fill="#3A5566" x="20" y="4" width="2" height="14" rx="0.5" transform="rotate(-20,21,11)"/>
      <!-- Star sparkle at tip -->
      <g transform="translate(24,2)">
        <rect fill="#7B746D" x="-0.4" y="-1.5" width="0.8" height="3" rx="0.2"/>
        <rect fill="#7B746D" x="-1.5" y="-0.4" width="3" height="0.8" rx="0.2"/>
      </g>
      <g transform="translate(22,5)">
        <rect fill="#7B746D" x="-0.3" y="-1" width="0.6" height="2" rx="0.15"/>
        <rect fill="#7B746D" x="-1" y="-0.3" width="2" height="0.6" rx="0.15"/>
      </g>
    </g>
  </g>
</svg>