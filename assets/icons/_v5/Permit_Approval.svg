<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- Document -->
    <g>
      <rect fill="#3A5566" x="1" y="1" width="22" height="26" rx="1.2"/>
      <rect fill="#F5F5F0" x="3" y="3" width="18" height="22" rx="0.5"/>
    </g>
    <!-- Title bar (solid) -->
    <rect fill="#3A5566" x="6" y="5" width="12" height="2" rx="0.3"/>
    <!-- Dot rows replacing body text -->
    <g>
      <circle fill="#7B746D" cx="6" cy="10" r="0.6"/>
      <circle fill="#7B746D" cx="8" cy="10" r="0.52"/>
      <circle fill="#7B746D" cx="9.8" cy="10" r="0.45"/>
      <circle fill="#7B746D" cx="11.4" cy="10" r="0.38"/>
      <circle fill="#7B746D" cx="12.8" cy="10" r="0.32"/>
    </g>
    <g>
      <circle fill="#7B746D" cx="6" cy="12.3" r="0.6"/>
      <circle fill="#7B746D" cx="8" cy="12.3" r="0.52"/>
      <circle fill="#7B746D" cx="9.8" cy="12.3" r="0.45"/>
      <circle fill="#7B746D" cx="11.4" cy="12.3" r="0.38"/>
    </g>
    <g>
      <circle fill="#7B746D" cx="6" cy="14.6" r="0.6"/>
      <circle fill="#7B746D" cx="8" cy="14.6" r="0.52"/>
      <circle fill="#7B746D" cx="9.8" cy="14.6" r="0.45"/>
    </g>
    <!-- Rubber stamp (bottom-left inside document) -->
    <g>
      <!-- Stamp base (flat bottom piece that makes the impression) -->
      <rect fill="#7B746D" x="4.5" y="20.5" width="6" height="1.5" rx="0.3"/>
      <!-- Stamp neck -->
      <rect fill="#7B746D" x="6" y="18.5" width="3" height="2.5" rx="0.2"/>
      <!-- Stamp handle (top grip) -->
      <rect fill="#3A5566" x="5" y="17" width="5" height="2" rx="0.8"/>
    </g>
    <!-- Approval checkmark circle (bottom-right, overlapping document edge) -->
    <g>
      <circle fill="#3A5566" cx="19" cy="21" r="5.5"/>
      <circle fill="#F5F5F0" cx="19" cy="21" r="3.8"/>
      <polyline fill="none" stroke="#3A5566" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" points="16.8,21 18.2,22.5 21.2,19"/>
    </g>
  </g>
</svg>