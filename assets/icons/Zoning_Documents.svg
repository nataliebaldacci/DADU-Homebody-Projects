<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- Map/document base -->
    <g>
      <rect fill="#3A5566" x="1" y="1" width="26" height="26" rx="1.2"/>
      <rect fill="#F5F5F0" x="2.5" y="2.5" width="23" height="23" rx="0.5"/>
    </g>
    <!-- Zone district blocks (like a zoning map) -->
    <g>
      <!-- Zone A (top-left) -->
      <rect fill="#3A5566" x="4" y="4" width="9" height="8" rx="0.4"/>
      <rect fill="#F5F5F0" x="5" y="5" width="7" height="6" rx="0.3"/>
      <!-- Zone label dots inside A -->
      <circle fill="#7B746D" cx="6.5" cy="7" r="0.5"/>
      <circle fill="#7B746D" cx="8.2" cy="7" r="0.42"/>
      <circle fill="#7B746D" cx="9.7" cy="7" r="0.35"/>
    </g>
    <g>
      <!-- Zone B (top-right) -->
      <rect fill="#3A5566" x="15" y="4" width="9.5" height="8" rx="0.4"/>
      <rect fill="#F5F5F0" x="16" y="5" width="7.5" height="6" rx="0.3"/>
      <!-- Zone label dots inside B -->
      <circle fill="#7B746D" cx="17.5" cy="7" r="0.5"/>
      <circle fill="#7B746D" cx="19.2" cy="7" r="0.42"/>
    </g>
    <g>
      <!-- Zone C (bottom-left) -->
      <rect fill="#3A5566" x="4" y="14" width="6" height="10" rx="0.4"/>
      <rect fill="#F5F5F0" x="5" y="15" width="4" height="8" rx="0.3"/>
      <!-- Zone label dots inside C -->
      <circle fill="#7B746D" cx="6.5" cy="18" r="0.5"/>
      <circle fill="#7B746D" cx="6.5" cy="20" r="0.42"/>
    </g>
    <g>
      <!-- Zone D (bottom-right, larger) -->
      <rect fill="#3A5566" x="12" y="14" width="12.5" height="10" rx="0.4"/>
      <rect fill="#F5F5F0" x="13" y="15" width="10.5" height="8" rx="0.3"/>
      <!-- Zone label dots inside D -->
      <circle fill="#7B746D" cx="15" cy="18" r="0.5"/>
      <circle fill="#7B746D" cx="17" cy="18" r="0.42"/>
      <circle fill="#7B746D" cx="18.8" cy="18" r="0.35"/>
      <circle fill="#7B746D" cx="15" cy="20.5" r="0.45"/>
      <circle fill="#7B746D" cx="17" cy="20.5" r="0.38"/>
    </g>
  </g>
</svg>