<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- Chart background -->
    <g>
      <rect fill="#3A5566" x="1" y="1" width="26" height="26" rx="1.2"/>
      <rect fill="#F5F5F0" x="2.5" y="2.5" width="23" height="23" rx="0.5"/>
    </g>
    <!-- Upward trend line -->
    <polyline fill="none" stroke="#3A5566" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="5,20 10,16 15,18 20,10 24,6"/>
    <!-- Arrow at end of trend -->
    <polygon fill="#3A5566" points="24,6 21,6.5 23.5,9"/>
    <!-- Data point dots along the line -->
    <circle fill="#3A5566" cx="5" cy="20" r="1.5"/>
    <circle fill="#3A5566" cx="10" cy="16" r="1.5"/>
    <circle fill="#3A5566" cx="15" cy="18" r="1.5"/>
    <circle fill="#3A5566" cx="20" cy="10" r="1.5"/>
    <!-- Axis dots replacing grid lines -->
    <g>
      <circle fill="#7B746D" cx="5" cy="23" r="0.45"/>
      <circle fill="#7B746D" cx="10" cy="23" r="0.4"/>
      <circle fill="#7B746D" cx="15" cy="23" r="0.38"/>
      <circle fill="#7B746D" cx="20" cy="23" r="0.35"/>
    </g>
  </g>
</svg>