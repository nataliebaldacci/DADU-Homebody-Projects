<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- Stacked permits (3 documents fanned) -->
    <g>
      <!-- Back doc -->
      <rect fill="#3A5566" x="5" y="1" width="18" height="22" rx="1" opacity="0.35"/>
      <!-- Middle doc -->
      <rect fill="#3A5566" x="3" y="3" width="18" height="22" rx="1" opacity="0.55"/>
      <!-- Front doc -->
      <rect fill="#3A5566" x="1" y="5" width="18" height="22" rx="1"/>
      <rect fill="#F5F5F0" x="2.5" y="6.5" width="15" height="19" rx="0.4"/>
    </g>
    <!-- Title bar on front doc -->
    <rect fill="#3A5566" x="4.5" y="8.5" width="10" height="1.8" rx="0.3"/>
    <!-- Dot rows (permit details) -->
    <g>
      <circle fill="#7B746D" cx="5" cy="13" r="0.55"/>
      <circle fill="#7B746D" cx="7" cy="13" r="0.48"/>
      <circle fill="#7B746D" cx="8.8" cy="13" r="0.4"/>
      <circle fill="#7B746D" cx="10.4" cy="13" r="0.35"/>
    </g>
    <g>
      <circle fill="#7B746D" cx="5" cy="15.5" r="0.55"/>
      <circle fill="#7B746D" cx="7" cy="15.5" r="0.48"/>
      <circle fill="#7B746D" cx="8.8" cy="15.5" r="0.4"/>
    </g>
    <g>
      <circle fill="#7B746D" cx="5" cy="18" r="0.55"/>
      <circle fill="#7B746D" cx="7" cy="18" r="0.48"/>
    </g>
    <!-- Wrench (trade tool, bottom-right overlapping) -->
    <g>
      <!-- Wrench head -->
      <circle fill="#3A5566" cx="22" cy="20" r="5"/>
      <circle fill="#F5F5F0" cx="22" cy="20" r="3.3"/>
      <!-- Wrench jaw notch -->
      <rect fill="#3A5566" x="21" y="14.5" width="2" height="4" rx="0.3"/>
      <!-- Bolt in center -->
      <polygon fill="#3A5566" points="22,18 23.5,19 23.5,21 22,22 20.5,21 20.5,19"/>
    </g>
  </g>
</svg>