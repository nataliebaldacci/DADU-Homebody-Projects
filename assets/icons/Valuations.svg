<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- Linen background circle -->
    <circle fill="#F0EBE1" cx="14" cy="14" r="14"/>
    <!-- House (solid filled shape: roof + walls) -->
    <g>
      <!-- Thick roof -->
      <polygon fill="#3A5566" points="2.5,10 10.5,2.5 18.5,10"/>
      <!-- Walls -->
      <rect fill="#3A5566" x="4.5" y="9" width="12" height="8.5" rx="0.5"/>
      <!-- White interior -->
      <polygon fill="#FFFFFF" points="5.5,9.5 10.5,4.5 15.5,9.5"/>
      <rect fill="#FFFFFF" x="6" y="9.5" width="9" height="6.5" rx="0.3"/>
    </g>
    <!-- Dollar sign (white cutout in house) -->
    <g>
      <rect fill="#3A5566" x="9.8" y="6.5" width="1.4" height="7.5" rx="0.3"/>
      <path fill="none" stroke="#3A5566" stroke-width="1.2" stroke-linecap="round" d="M12.5,8.2 C12.5,7.3 11.6,6.8 10.5,6.8 C9.4,6.8 8.5,7.4 8.5,8.2 C8.5,9.1 9.4,9.5 10.5,9.8 C11.6,10.1 12.5,10.6 12.5,11.5 C12.5,12.4 11.6,13 10.5,13 C9.4,13 8.5,12.4 8.5,11.5"/>
    </g>
    <!-- Price tag (below house, slight angle) -->
    <g transform="rotate(-5 10 21)">
      <rect fill="#3A5566" x="3" y="18" width="14.5" height="6" rx="1.5"/>
      <!-- Tag hole -->
      <circle fill="#FFFFFF" cx="6" cy="21" r="1.3"/>
      <circle fill="#3A5566" cx="6" cy="21" r="0.5"/>
      <!-- Tag lines -->
      <rect fill="#FFFFFF" x="9" y="19.5" width="6.5" height="1" rx="0.3"/>
      <rect fill="#FFFFFF" x="9" y="21.5" width="5" height="1" rx="0.3"/>
    </g>
    <!-- Diminishing dots (single column) -->
    <g>
      <circle fill="#7B746D" cx="22.5" cy="5" r="1.05"/>
      <circle fill="#7B746D" cx="22.5" cy="8" r="0.95"/>
      <circle fill="#7B746D" cx="22.5" cy="10.8" r="0.85"/>
      <circle fill="#7B746D" cx="22.5" cy="13.3" r="0.75"/>
      <circle fill="#7B746D" cx="22.5" cy="15.5" r="0.65"/>
    </g>
  </g>
</svg>
