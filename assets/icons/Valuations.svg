      <path fill="none" stroke="#3A5566" stroke-width="1.5" stroke-linecap="round" d="M16,15.5 C16,14.5 15,13.8 14,13.8 C13,13.8 12,14.5 12,15.5 C12,16.5 13,17 14,17.3 C15,17.6 16,18.2 16,19.2 C16,20.2 15,20.8 14,20.8 C13,20.8 12,20.2 12,19.2"/>
      <rect fill="#3A5566" x="13.4" y="13" width="1.2" height="8.5" rx="0.3"/>
    </g>
    <!-- Price tag dots (replacing tag label text) -->
    <g>
      <circle fill="#7B746D" cx="8" cy="16" r="0.5"/>
      <circle fill="#7B746D" cx="8" cy="18" r="0.45"/>
      <circle fill="#7B746D" cx="8" cy="20" r="0.4"/>
      <circle fill="#7B746D" cx="20" cy="16" r="0.5"/>
      <circle fill="#7B746D" cx="20" cy="18" r="0.45"/>
      <circle fill="#7B746D" cx="20" cy="20" r="0.4"/>
