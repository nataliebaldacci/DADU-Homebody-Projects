<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- Concentric circles (radar/target) -->
    <g>
      <circle fill="none" stroke="#3A5566" stroke-width="1.2" cx="11" cy="13" r="10"/>
    </g>
    <g>
      <circle fill="none" stroke="#3A5566" stroke-width="1.2" cx="11" cy="13" r="6.5"/>
    </g>
    <g>
      <circle fill="none" stroke="#3A5566" stroke-width="1.2" cx="11" cy="13" r="3"/>
    </g>
    <!-- Center dot -->
    <g>
      <circle fill="#3A5566" cx="11" cy="13" r="1.5"/>
    </g>
    <!-- Crosshair lines -->
    <g>
      <rect fill="#3A5566" x="10.4" y="2" width="1.2" height="5" rx="0.3"/>
      <rect fill="#3A5566" x="10.4" y="19" width="1.2" height="5" rx="0.3"/>
      <rect fill="#3A5566" x="0" y="12.4" width="5" height="1.2" rx="0.3"/>
      <rect fill="#3A5566" x="17" y="12.4" width="5" height="1.2" rx="0.3"/>
    </g>
    <!-- Data point markers scattered on rings -->
    <g>
      <circle fill="#3A5566" cx="15.5" cy="6.5" r="0.8"/>
      <circle fill="#3A5566" cx="4.5" cy="8" r="0.8"/>
      <circle fill="#3A5566" cx="17" cy="16" r="0.8"/>
    </g>
    <!-- Diminishing dots column -->
    <g><circle fill="#7B746D" cx="24.5" cy="3.5" r="1.05"/></g>
    <g><circle fill="#7B746D" cx="24.5" cy="6.6" r="0.87"/></g>
    <g><circle fill="#7B746D" cx="24.5" cy="9.3" r="0.69"/></g>
    <g><circle fill="#7B746D" cx="24.5" cy="11.6" r="0.51"/></g>
    <!-- Scattered warm stone dots (data points) -->
    <g><circle fill="#7B746D" cx="7" cy="4.5" r="0.51"/></g>
    <g><circle fill="#7B746D" cx="18" cy="9" r="0.38"/></g>
    <g><circle fill="#7B746D" cx="5" cy="19" r="0.51"/></g>
    <g><circle fill="#7B746D" cx="15" cy="21" r="0.38"/></g>
  </g>
</svg>
