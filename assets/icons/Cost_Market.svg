<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- Linen background circle -->
    <circle fill="#F0EBE1" cx="14" cy="14" r="14"/>
    <!-- Zigzag trend arrow (behind dollar circle) -->
    <g>
      <polyline fill="none" stroke="#3A5566" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" points="2,20 7,24 11,18 17,12"/>
      <!-- Arrowhead -->
      <polygon fill="#3A5566" points="15.5,9.5 18.5,11.5 17,14"/>
    </g>
    <!-- Dollar circle ring -->
    <g>
      <circle fill="#3A5566" cx="10" cy="9" r="7.5"/>
      <circle fill="#FFFFFF" cx="10" cy="9" r="5.5"/>
    </g>
    <!-- Dollar sign $ -->
    <g>
      <rect fill="#3A5566" x="9.3" y="4.5" width="1.4" height="9" rx="0.3"/>
      <path fill="none" stroke="#3A5566" stroke-width="1.2" stroke-linecap="round" d="M12.2,6.8 C12.2,5.8 11.3,5.2 10,5.2 C8.7,5.2 7.8,5.9 7.8,6.8 C7.8,7.8 8.7,8.3 10,8.7 C11.3,9.1 12.2,9.6 12.2,10.7 C12.2,11.7 11.3,12.4 10,12.4 C8.7,12.4 7.8,11.7 7.8,10.7"/>
    </g>
    <!-- Dot grid (3x3 diminishing) -->
    <g>
      <circle fill="#7B746D" cx="19.5" cy="16" r="0.9"/>
      <circle fill="#7B746D" cx="22" cy="16" r="0.9"/>
      <circle fill="#7B746D" cx="24.5" cy="16" r="0.9"/>
      <circle fill="#7B746D" cx="19.5" cy="19" r="0.85"/>
      <circle fill="#7B746D" cx="22" cy="19" r="0.85"/>
      <circle fill="#7B746D" cx="24.5" cy="19" r="0.85"/>
      <circle fill="#7B746D" cx="19.5" cy="22" r="0.75"/>
      <circle fill="#7B746D" cx="22" cy="22" r="0.75"/>
      <circle fill="#7B746D" cx="24.5" cy="22" r="0.75"/>
    </g>
  </g>
</svg>
