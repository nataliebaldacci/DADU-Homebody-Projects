      <rect fill="#3A5566" x="11" y="8" width="6" height="1.5" rx="0.5"/>
    </g>
    <!-- Bottom drawer: dot row replacing label -->
    <g>
      <circle fill="#7B746D" cx="8" cy="17.5" r="0.6"/>
      <circle fill="#7B746D" cx="10" cy="17.5" r="0.5"/>
      <circle fill="#7B746D" cx="11.8" cy="17.5" r="0.4"/>
      <circle fill="#7B746D" cx="13.3" cy="17.5" r="0.35"/>
    </g>
    <!-- Bottom drawer handle -->
    <g>
      <rect fill="#3A5566" x="11" y="20" width="6" height="1.5" rx="0.5"/>
    </g>
