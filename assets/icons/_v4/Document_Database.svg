<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- Cabinet -->
    <g>
      <rect fill="#3A5566" x="3" y="1" width="22" height="26" rx="1.5"/>
      <rect fill="#F5F5F0" x="5" y="3" width="18" height="10" rx="0.5"/>
      <rect fill="#F5F5F0" x="5" y="15" width="18" height="10" rx="0.5"/>
    </g>
    <!-- Top drawer: dot row replacing label -->
    <g>
      <circle fill="#7B746D" cx="8" cy="5.5" r="0.6"/>
      <circle fill="#7B746D" cx="10" cy="5.5" r="0.5"/>
      <circle fill="#7B746D" cx="11.8" cy="5.5" r="0.4"/>
      <circle fill="#7B746D" cx="13.3" cy="5.5" r="0.35"/>
    </g>
    <!-- Top drawer handle -->
