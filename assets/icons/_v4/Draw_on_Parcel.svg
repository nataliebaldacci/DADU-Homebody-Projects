    <!-- Building drawn on grid -->
    <rect fill="none" stroke="#3A5566" stroke-width="1.2" x="7" y="9.5" width="7.5" height="9.5" rx="0.3"/>
    <rect fill="none" stroke="#3A5566" stroke-width="0.8" x="9" y="13.5" width="3.5" height="5.5"/>
    <!-- Pencil -->
    <g>
      <rect fill="#3A5566" x="20" y="2" width="2.5" height="12" rx="0.5" transform="rotate(15,21.3,8)"/>
      <polygon fill="#3A5566" points="22,16 24.5,19 19.5,19" transform="rotate(15,22,17.5)"/>
    </g>
  </g>
