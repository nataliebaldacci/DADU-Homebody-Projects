<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- Paper -->
    <g>
      <rect fill="#3A5566" x="1" y="1" width="20" height="26" rx="1"/>
      <rect fill="#F5F5F0" x="2.5" y="2.5" width="17" height="23" rx="0.4"/>
    </g>
    <!-- Dot grid (graph paper dots) -->
    <g>
      <circle fill="#7B746D" cx="5.5" cy="5.5" r="0.35"/>
      <circle fill="#7B746D" cx="8.5" cy="5.5" r="0.35"/>
      <circle fill="#7B746D" cx="11.5" cy="5.5" r="0.35"/>
      <circle fill="#7B746D" cx="14.5" cy="5.5" r="0.35"/>
      <circle fill="#7B746D" cx="5.5" cy="8.5" r="0.35"/>
      <circle fill="#7B746D" cx="14.5" cy="8.5" r="0.35"/>
      <circle fill="#7B746D" cx="5.5" cy="11.5" r="0.35"/>
      <circle fill="#7B746D" cx="14.5" cy="11.5" r="0.35"/>
      <circle fill="#7B746D" cx="5.5" cy="14.5" r="0.35"/>
      <circle fill="#7B746D" cx="14.5" cy="14.5" r="0.35"/>
      <circle fill="#7B746D" cx="5.5" cy="20.5" r="0.35"/>
      <circle fill="#7B746D" cx="8.5" cy="20.5" r="0.35"/>
      <circle fill="#7B746D" cx="11.5" cy="20.5" r="0.35"/>
      <circle fill="#7B746D" cx="14.5" cy="20.5" r="0.35"/>
