      <circle fill="#7B746D" cx="20.2" cy="7" r="0.4"/>
      <circle fill="#7B746D" cx="21.4" cy="7" r="0.35"/>
      <circle fill="#7B746D" cx="17.2" cy="8.8" r="0.55"/>
      <circle fill="#7B746D" cx="18.8" cy="8.8" r="0.5"/>
      <circle fill="#7B746D" cx="20.2" cy="8.8" r="0.4"/>
      <circle fill="#7B746D" cx="17.2" cy="10.5" r="0.55"/>
      <circle fill="#7B746D" cx="18.8" cy="10.5" r="0.5"/>
    </g>
    <!-- Bottom-left panel: dot rows replace text -->
    <g>
      <rect fill="#3A5566" x="4" y="14" width="9.5" height="9" rx="0.5"/>
      <rect fill="#F5F5F0" x="5.5" y="15.5" width="6.5" height="6" rx="0.3"/>
      <circle fill="#7B746D" cx="6.8" cy="17" r="0.55"/>
