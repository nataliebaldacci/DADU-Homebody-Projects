      <circle fill="#7B746D" cx="6.8" cy="19" r="0.55"/>
      <circle fill="#7B746D" cx="8.4" cy="19" r="0.5"/>
      <circle fill="#7B746D" cx="9.8" cy="19" r="0.4"/>
    </g>
    <!-- Bottom-right panel: line chart with dot endpoints -->
    <g>
      <rect fill="#3A5566" x="14.5" y="14" width="9.5" height="9" rx="0.5"/>
