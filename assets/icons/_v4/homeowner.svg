<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- House -->
    <g>
      <polygon fill="#3A5566" points="1,15 14,3 27,15"/>
      <rect fill="#3A5566" x="4" y="14" width="20" height="12" rx="0.5"/>
      <rect fill="#F5F5F0" x="6" y="15.5" width="16" height="9" rx="0.3"/>
    </g>
    <!-- Door -->
    <g>
      <rect fill="#3A5566" x="11.5" y="18.5" width="5" height="6" rx="0.5"/>
      <circle fill="#F5F5F0" cx="15" cy="22" r="0.5"/>
    </g>
    <!-- Dot grid replacing window (left side of house) -->
    <g>
      <circle fill="#7B746D" cx="8" cy="17.5" r="0.55"/>
      <circle fill="#7B746D" cx="9.8" cy="17.5" r="0.45"/>
      <circle fill="#7B746D" cx="8" cy="19.5" r="0.5"/>
      <circle fill="#7B746D" cx="9.8" cy="19.5" r="0.4"/>
      <circle fill="#7B746D" cx="8" cy="21.5" r="0.45"/>
      <circle fill="#7B746D" cx="9.8" cy="21.5" r="0.35"/>
    </g>
    <!-- Dot row replacing window (right side) -->
    <g>
      <circle fill="#7B746D" cx="18.5" cy="17.5" r="0.55"/>
      <circle fill="#7B746D" cx="20.3" cy="17.5" r="0.45"/>
      <circle fill="#7B746D" cx="18.5" cy="19.5" r="0.5"/>
      <circle fill="#7B746D" cx="20.3" cy="19.5" r="0.4"/>
    </g>
  </g>
</svg>