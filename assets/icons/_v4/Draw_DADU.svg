<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- Drawing canvas -->
    <g>
      <rect fill="#3A5566" x="1" y="4" width="21" height="21" rx="0.8"/>
      <rect fill="#F5F5F0" x="2.5" y="5.5" width="18" height="18" rx="0.3"/>
    </g>
    <!-- Dot grid (replaces grid lines - like dot paper) -->
    <g>
      <circle fill="#7B746D" cx="5.5" cy="8.5" r="0.4"/>
      <circle fill="#7B746D" cx="9" cy="8.5" r="0.4"/>
      <circle fill="#7B746D" cx="12.5" cy="8.5" r="0.4"/>
      <circle fill="#7B746D" cx="16" cy="8.5" r="0.4"/>
      <circle fill="#7B746D" cx="5.5" cy="12" r="0.4"/>
      <circle fill="#7B746D" cx="16" cy="12" r="0.4"/>
      <circle fill="#7B746D" cx="5.5" cy="15.5" r="0.4"/>
      <circle fill="#7B746D" cx="16" cy="15.5" r="0.4"/>
      <circle fill="#7B746D" cx="5.5" cy="19" r="0.4"/>
      <circle fill="#7B746D" cx="9" cy="19" r="0.4"/>
      <circle fill="#7B746D" cx="12.5" cy="19" r="0.4"/>
      <circle fill="#7B746D" cx="16" cy="19" r="0.4"/>
    </g>
    <!-- House sketch on grid -->
    <g>
      <path fill="none" stroke="#3A5566" stroke-width="1.4" d="M8,18.5 L8,13 L11.5,10 L15,13 L15,18.5 Z"/>
