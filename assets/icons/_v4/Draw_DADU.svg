    </g>
    <!-- Pencil -->
    <g>
      <rect fill="#3A5566" x="19" y="1" width="2.5" height="11" rx="0.4" transform="rotate(25,20.3,6.5)"/>
      <polygon fill="#3A5566" points="23.5,13 25.2,16 21.8,16" transform="rotate(25,23.5,14.5)"/>
    </g>
