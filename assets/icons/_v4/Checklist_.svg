<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- Clipboard board -->
    <g>
      <rect fill="#3A5566" x="4" y="3" width="20" height="22" rx="1.2"/>
      <rect fill="#F5F5F0" x="6" y="5.5" width="16" height="18" rx="0.5"/>
    </g>
    <!-- Clipboard clip -->
    <g>
      <rect fill="#3A5566" x="9" y="1.5" width="10" height="4" rx="1"/>
    </g>
    <!-- Check item 1: checkbox + dot row for text -->
    <g>
      <rect fill="#3A5566" x="8" y="8" width="3.5" height="3.5" rx="0.4"/>
      <polyline fill="none" stroke="#F5F5F0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" points="8.8,9.8 9.8,10.8 11,8.8"/>
      <circle fill="#7B746D" cx="13.5" cy="9.7" r="0.7"/>
      <circle fill="#7B746D" cx="15.8" cy="9.7" r="0.6"/>
      <circle fill="#7B746D" cx="17.8" cy="9.7" r="0.5"/>
      <circle fill="#7B746D" cx="19.5" cy="9.7" r="0.4"/>
    </g>
    <!-- Check item 2: checkbox + dot row for text -->
    <g>
      <rect fill="#3A5566" x="8" y="13.5" width="3.5" height="3.5" rx="0.4"/>
      <polyline fill="none" stroke="#F5F5F0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" points="8.8,15.3 9.8,16.3 11,14.3"/>
      <circle fill="#7B746D" cx="13.5" cy="15.2" r="0.7"/>
      <circle fill="#7B746D" cx="15.8" cy="15.2" r="0.6"/>
      <circle fill="#7B746D" cx="17.8" cy="15.2" r="0.5"/>
      <circle fill="#7B746D" cx="19.5" cy="15.2" r="0.4"/>
    </g>
    <!-- Check item 3: empty checkbox + dot row -->
    <g>
      <rect fill="none" stroke="#3A5566" stroke-width="1" x="8.5" y="19" width="3" height="3" rx="0.3"/>
      <circle fill="#7B746D" cx="13.5" cy="20.5" r="0.7"/>
      <circle fill="#7B746D" cx="15.8" cy="20.5" r="0.6"/>
      <circle fill="#7B746D" cx="17.8" cy="20.5" r="0.5"/>
      <circle fill="#7B746D" cx="19.5" cy="20.5" r="0.4"/>
    </g>
  </g>
</svg>