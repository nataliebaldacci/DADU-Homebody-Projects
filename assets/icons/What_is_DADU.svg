<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- Open book / guide -->
    <g>
      <rect fill="#3A5566" x="1" y="3" width="26" height="22" rx="1.2"/>
      <rect fill="#F5F5F0" x="2.5" y="4.5" width="23" height="19" rx="0.5"/>
      <!-- Book spine -->
      <rect fill="#3A5566" x="13" y="3" width="2" height="22" rx="0.3"/>
    </g>
    <!-- Left page: small house icon -->
    <g>
      <polygon fill="#3A5566" points="4.5,11 8,7.5 11.5,11"/>
      <rect fill="#3A5566" x="5.5" y="10.5" width="5" height="4" rx="0.3"/>
      <rect fill="#F5F5F0" x="6.5" y="11.3" width="3" height="2.5" rx="0.2"/>
      <rect fill="#3A5566" x="7.3" y="12" width="1.4" height="2.5" rx="0.2"/>
    </g>
    <!-- Left page: dot text below house -->
    <g>
      <circle fill="#7B746D" cx="4.5" cy="17" r="0.5"/>
      <circle fill="#7B746D" cx="6.3" cy="17" r="0.42"/>
      <circle fill="#7B746D" cx="7.9" cy="17" r="0.35"/>
    </g>
    <g>
      <circle fill="#7B746D" cx="4.5" cy="19.2" r="0.5"/>
      <circle fill="#7B746D" cx="6.3" cy="19.2" r="0.42"/>
      <circle fill="#7B746D" cx="7.9" cy="19.2" r="0.35"/>
      <circle fill="#7B746D" cx="9.3" cy="19.2" r="0.3"/>
    </g>
    <g>
      <circle fill="#7B746D" cx="4.5" cy="21.4" r="0.5"/>
      <circle fill="#7B746D" cx="6.3" cy="21.4" r="0.42"/>
    </g>
    <!-- Right page: title bar + dot text rows -->
    <rect fill="#3A5566" x="17" y="7" width="7" height="1.5" rx="0.3"/>
    <g>
      <circle fill="#7B746D" cx="17" cy="11.5" r="0.5"/>
      <circle fill="#7B746D" cx="18.8" cy="11.5" r="0.42"/>
      <circle fill="#7B746D" cx="20.4" cy="11.5" r="0.35"/>
      <circle fill="#7B746D" cx="21.8" cy="11.5" r="0.3"/>
    </g>
    <g>
      <circle fill="#7B746D" cx="17" cy="13.8" r="0.5"/>
      <circle fill="#7B746D" cx="18.8" cy="13.8" r="0.42"/>
      <circle fill="#7B746D" cx="20.4" cy="13.8" r="0.35"/>
    </g>
    <g>
      <circle fill="#7B746D" cx="17" cy="16.1" r="0.5"/>
      <circle fill="#7B746D" cx="18.8" cy="16.1" r="0.42"/>
      <circle fill="#7B746D" cx="20.4" cy="16.1" r="0.35"/>
      <circle fill="#7B746D" cx="21.8" cy="16.1" r="0.3"/>
      <circle fill="#7B746D" cx="23" cy="16.1" r="0.25"/>
    </g>
    <g>
      <circle fill="#7B746D" cx="17" cy="18.4" r="0.5"/>
      <circle fill="#7B746D" cx="18.8" cy="18.4" r="0.42"/>
    </g>
    <g>
      <circle fill="#7B746D" cx="17" cy="20.7" r="0.5"/>
      <circle fill="#7B746D" cx="18.8" cy="20.7" r="0.42"/>
      <circle fill="#7B746D" cx="20.4" cy="20.7" r="0.35"/>
    </g>
