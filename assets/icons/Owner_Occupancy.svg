<svg xmlns="http://www.w3.org/2000/svg" width="28" height="24" viewBox="0 0 28 24">
  <g>
    <!-- House body -->
    <g>
      <rect fill="#3A5566" x="2" y="10.5" width="13" height="12.5" rx="0.8"/>
      <rect fill="#F5F5F0" x="3.5" y="12" width="10" height="9.5" rx="0.4"/>
    </g>
    <!-- Roof -->
    <g>
      <path fill="#3A5566" d="M0.5,11.5 L8.5,3 L16.5,11.5 Z"/>
    </g>
    <!-- Door -->
    <g>
      <rect fill="#3A5566" x="6.5" y="16" width="4" height="5.5" rx="0.4"/>
    </g>
    <!-- Window -->
    <g>
      <rect fill="#3A5566" x="4.5" y="13" width="2.5" height="2.5" rx="0.3"/>
    </g>
    <!-- Key -->
    <g>
      <!-- Key head (circle) -->
      <circle fill="#3A5566" cx="21" cy="15" r="3.2"/>
      <circle fill="#F5F5F0" cx="21" cy="15" r="1.5"/>
      <!-- Key shaft -->
      <rect fill="#3A5566" x="17.8" y="14.3" width="6.5" height="1.4" rx="0.3" transform="rotate(45,21,15)"/>
      <!-- Key teeth -->
      <rect fill="#3A5566" x="17" y="18.5" width="1" height="1.5" rx="0.2" transform="rotate(45,17.5,19)"/>
      <rect fill="#3A5566" x="18.5" y="20" width="1" height="1.2" rx="0.2" transform="rotate(45,19,20.5)"/>
    </g>
    <!-- Diminishing dots -->
    <g><circle fill="#7B746D" cx="19" cy="3.5" r="1.05"/></g>
    <g><circle fill="#7B746D" cx="19" cy="6.6" r="0.87"/></g>
    <g><circle fill="#7B746D" cx="19" cy="9.3" r="0.69"/></g>
    <g><circle fill="#7B746D" cx="19" cy="11.6" r="0.51"/></g>
  </g>
</svg>
