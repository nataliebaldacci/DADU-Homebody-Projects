<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- Calendar body -->
    <g>
      <rect fill="#3A5566" x="1" y="4" width="19" height="19" rx="1.5"/>
      <rect fill="#F5F5F0" x="2.8" y="8.5" width="15.4" height="12.5" rx="0.5"/>
    </g>
    <!-- Calendar top bar -->
    <g>
      <rect fill="#3A5566" x="1" y="4" width="19" height="4.5" rx="1.5"/>
    </g>
    <!-- Calendar tabs -->
    <g>
      <rect fill="#3A5566" x="5.5" y="2" width="1.5" height="4" rx="0.5"/>
      <rect fill="#3A5566" x="14" y="2" width="1.5" height="4" rx="0.5"/>
    </g>
    <!-- Calendar grid cells -->
    <g>
      <rect fill="#3A5566" x="4" y="10" width="2.2" height="2.2" rx="0.3"/>
      <rect fill="#3A5566" x="7.5" y="10" width="2.2" height="2.2" rx="0.3"/>
      <rect fill="#3A5566" x="11" y="10" width="2.2" height="2.2" rx="0.3"/>
      <rect fill="#3A5566" x="14.5" y="10" width="2.2" height="2.2" rx="0.3"/>
    </g>
    <g>
      <rect fill="#3A5566" x="4" y="14" width="2.2" height="2.2" rx="0.3"/>
      <rect fill="#3A5566" x="7.5" y="14" width="2.2" height="2.2" rx="0.3"/>
      <rect fill="#3A5566" x="11" y="14" width="2.2" height="2.2" rx="0.3"/>
      <rect fill="#3A5566" x="14.5" y="14" width="2.2" height="2.2" rx="0.3"/>
    </g>
    <g>
      <rect fill="#3A5566" x="4" y="18" width="2.2" height="2.2" rx="0.3"/>
      <rect fill="#3A5566" x="7.5" y="18" width="2.2" height="2.2" rx="0.3"/>
    </g>
    <!-- Diminishing dots column -->
    <g><circle fill="#7B746D" cx="24" cy="5.5" r="1.05"/></g>
    <g><circle fill="#7B746D" cx="24" cy="8.6" r="0.87"/></g>
    <g><circle fill="#7B746D" cx="24" cy="11.3" r="0.69"/></g>
    <g><circle fill="#7B746D" cx="24" cy="13.6" r="0.51"/></g>
    <!-- Second dot column -->
    <g><circle fill="#7B746D" cx="27" cy="7.2" r="0.87"/></g>
    <g><circle fill="#7B746D" cx="27" cy="9.9" r="0.69"/></g>
    <g><circle fill="#7B746D" cx="27" cy="12.2" r="0.51"/></g>
    <g><circle fill="#7B746D" cx="27" cy="14.2" r="0.38"/></g>
