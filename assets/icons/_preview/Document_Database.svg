<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- Filing cabinet body -->
    <g>
      <rect fill="#3A5566" x="2" y="1" width="17" height="24" rx="1"/>
      <rect fill="#F5F5F0" x="3.5" y="2.5" width="14" height="21" rx="0.4"/>
    </g>
    <!-- Drawer 1 -->
    <g>
      <rect fill="#3A5566" x="3.5" y="2.5" width="14" height="6.5"/>
      <rect fill="#F5F5F0" x="4.5" y="3.5" width="12" height="4.5" rx="0.3"/>
      <rect fill="#3A5566" x="8.5" y="5" width="4" height="1.2" rx="0.4"/>
    </g>
    <!-- Drawer 2 -->
    <g>
      <rect fill="#3A5566" x="3.5" y="10" width="14" height="6.5"/>
      <rect fill="#F5F5F0" x="4.5" y="11" width="12" height="4.5" rx="0.3"/>
      <rect fill="#3A5566" x="8.5" y="12.5" width="4" height="1.2" rx="0.4"/>
    </g>
    <!-- Drawer 3 -->
    <g>
      <rect fill="#3A5566" x="3.5" y="17.5" width="14" height="6"/>
      <rect fill="#F5F5F0" x="4.5" y="18.5" width="12" height="4" rx="0.3"/>
      <rect fill="#3A5566" x="8.5" y="19.8" width="4" height="1.2" rx="0.4"/>
    </g>
    <!-- Diminishing dots -->
    <g><circle fill="#7B746D" cx="24" cy="4" r="1.05"/></g>
    <g><circle fill="#7B746D" cx="24" cy="7.1" r="0.87"/></g>
    <g><circle fill="#7B746D" cx="24" cy="9.8" r="0.69"/></g>
    <g><circle fill="#7B746D" cx="24" cy="12.1" r="0.51"/></g>
    <!-- Second dot column -->
    <g><circle fill="#7B746D" cx="27" cy="5.8" r="0.87"/></g>
    <g><circle fill="#7B746D" cx="27" cy="8.5" r="0.69"/></g>
    <g><circle fill="#7B746D" cx="27" cy="10.8" r="0.51"/></g>
    <g><circle fill="#7B746D" cx="27" cy="12.8" r="0.38"/></g>
  </g>
</svg>
