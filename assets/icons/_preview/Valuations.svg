<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- House -->
    <g>
      <path fill="#3A5566" d="M10,1 L1,9 L3,9 L3,16 L17,16 L17,9 L19,9 Z"/>
      <rect fill="#F5F5F0" x="4.5" y="10" width="11" height="4.5" rx="0.3"/>
    </g>
    <!-- Dollar sign on house (correct S orientation) -->
    <g>
      <rect fill="#3A5566" x="9.3" y="10.2" width="1.4" height="4.5" rx="0.3"/>
      <path fill="none" stroke="#3A5566" stroke-width="0.9" stroke-linecap="round" d="M11.5,11.5 C11.5,10.8 11,10.5 10,10.5 C9,10.5 8.5,11 8.5,11.5 C8.5,12.2 9,12.5 10,12.8 C11,13.1 11.5,13.4 11.5,14 C11.5,14.5 11,14.8 10,14.8 C9,14.8 8.5,14.5 8.5,14"/>
    </g>
    <!-- Simple tag/price label below -->
    <g>
      <rect fill="#3A5566" x="4" y="18" width="12" height="7" rx="1"/>
      <rect fill="#F5F5F0" x="5.5" y="19.5" width="9" height="4" rx="0.4"/>
      <!-- Price lines on tag -->
      <rect fill="#3A5566" x="7" y="20.5" width="6" height="0.8" rx="0.2"/>
      <rect fill="#3A5566" x="7" y="22" width="4" height="0.8" rx="0.2"/>
    </g>
    <!-- Diminishing dots -->
    <g><circle fill="#7B746D" cx="24" cy="4" r="1.05"/></g>
    <g><circle fill="#7B746D" cx="24" cy="7.1" r="0.87"/></g>
    <g><circle fill="#7B746D" cx="24" cy="9.8" r="0.69"/></g>
    <g><circle fill="#7B746D" cx="24" cy="12.1" r="0.51"/></g>
    <!-- Second dot column -->
    <g><circle fill="#7B746D" cx="27" cy="5.8" r="0.69"/></g>
    <g><circle fill="#7B746D" cx="27" cy="8.1" r="0.51"/></g>
    <g><circle fill="#7B746D" cx="27" cy="10.1" r="0.38"/></g>
  </g>
</svg>
