<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- Parcel/lot outline -->
    <g>
      <rect fill="none" stroke="#3A5566" stroke-width="1.5" x="1.5" y="6" width="16" height="16" rx="0.5" stroke-dasharray="3,1.5"/>
    </g>
    <!-- DADU footprint drawn on parcel -->
    <g>
      <rect fill="#3A5566" x="5" y="12" width="8" height="6.5" rx="0.5"/>
      <rect fill="#F5F5F0" x="6.2" y="13.2" width="5.6" height="4.1" rx="0.3"/>
    </g>
    <!-- Pencil drawing -->
    <g>
      <!-- Pencil body -->
      <rect fill="#3A5566" x="14" y="1" width="2.5" height="12" rx="0.4" transform="rotate(30,15.25,7)"/>
      <!-- Pencil tip -->
      <path fill="#3A5566" d="M19.5,14.5 L21,17 L18,17 Z" transform="rotate(30,19.5,15.5)"/>
    </g>
    <!-- Dimension arrows -->
    <g>
      <rect fill="#3A5566" x="5" y="20" width="8" height="0.6" rx="0.2"/>
      <path fill="#3A5566" d="M5,19.5 L5,21.1 L3.5,20.3 Z"/>
      <path fill="#3A5566" d="M13,19.5 L13,21.1 L14.5,20.3 Z"/>
    </g>
    <!-- Dots (subtle, bottom-right) -->
    <g>
      <circle fill="#7B746D" cx="22" cy="22" r="0.9"/>
      <circle fill="#7B746D" cx="25" cy="22" r="0.7"/>
      <circle fill="#7B746D" cx="22" cy="25" r="0.7"/>
      <circle fill="#7B746D" cx="25" cy="25" r="0.5"/>
    </g>
  </g>
</svg>
