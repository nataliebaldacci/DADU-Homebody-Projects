<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- Document stack -->
    <g>
      <rect fill="#3A5566" x="4" y="3" width="13" height="17" rx="0.8" opacity="0.3"/>
      <rect fill="#3A5566" x="2" y="1" width="13" height="17" rx="0.8"/>
      <rect fill="#F5F5F0" x="3.5" y="2.5" width="10" height="14" rx="0.3"/>
    </g>
    <!-- Text lines -->
    <g>
      <rect fill="#3A5566" x="5" y="4.5" width="7" height="1" rx="0.3"/>
      <rect fill="#3A5566" x="5" y="7" width="5.5" height="1" rx="0.3"/>
      <rect fill="#3A5566" x="5" y="9.5" width="6.5" height="1" rx="0.3"/>
      <rect fill="#3A5566" x="5" y="12" width="4" height="1" rx="0.3"/>
    </g>
    <!-- Magnifying glass -->
    <g>
      <circle fill="none" stroke="#3A5566" stroke-width="2" cx="14" cy="20" r="4.5"/>
      <rect fill="#3A5566" x="17.5" y="23" width="2" height="5" rx="0.5" transform="rotate(-45,18.5,25.5)"/>
    </g>
    <!-- Dots (subtle, top-right) -->
    <g>
      <circle fill="#7B746D" cx="22" cy="2" r="0.9"/>
      <circle fill="#7B746D" cx="25" cy="2" r="0.7"/>
      <circle fill="#7B746D" cx="22" cy="5" r="0.7"/>
      <circle fill="#7B746D" cx="25" cy="5" r="0.5"/>
    </g>
