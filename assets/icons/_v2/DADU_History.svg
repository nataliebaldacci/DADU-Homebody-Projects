<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- Vertical timeline line -->
    <g>
      <rect fill="#3A5566" x="5.5" y="1" width="1.5" height="24" rx="0.5"/>
    </g>
    <!-- Timeline node 1 (top) -->
    <g>
      <circle fill="#3A5566" cx="6.25" cy="5" r="2.5"/>
      <circle fill="#F5F5F0" cx="6.25" cy="5" r="1.3"/>
    </g>
    <!-- Text lines for node 1 -->
    <g>
      <rect fill="#3A5566" x="11" y="3.8" width="7" height="1.2" rx="0.3"/>
      <rect fill="#3A5566" x="11" y="5.8" width="5" height="0.8" rx="0.2" opacity="0.5"/>
    </g>
    <!-- Timeline node 2 (middle) -->
    <g>
      <circle fill="#3A5566" cx="6.25" cy="13" r="2.5"/>
      <circle fill="#F5F5F0" cx="6.25" cy="13" r="1.3"/>
    </g>
    <!-- Text lines for node 2 -->
    <g>
      <rect fill="#3A5566" x="11" y="11.8" width="8" height="1.2" rx="0.3"/>
      <rect fill="#3A5566" x="11" y="13.8" width="5.5" height="0.8" rx="0.2" opacity="0.5"/>
    </g>
    <!-- Timeline node 3 (bottom) -->
    <g>
      <circle fill="#3A5566" cx="6.25" cy="21" r="2.5"/>
      <circle fill="#F5F5F0" cx="6.25" cy="21" r="1.3"/>
    </g>
    <!-- Text lines for node 3 -->
    <g>
      <rect fill="#3A5566" x="11" y="19.8" width="6" height="1.2" rx="0.3"/>
      <rect fill="#3A5566" x="11" y="21.8" width="4.5" height="0.8" rx="0.2" opacity="0.5"/>
    </g>
    <!-- Dots (subtle, bottom-right) -->
    <g>
      <circle fill="#7B746D" cx="22" cy="22" r="0.9"/>
      <circle fill="#7B746D" cx="25" cy="22" r="0.7"/>
      <circle fill="#7B746D" cx="22" cy="25" r="0.7"/>
      <circle fill="#7B746D" cx="25" cy="25" r="0.5"/>
    </g>
  </g>
</svg>
