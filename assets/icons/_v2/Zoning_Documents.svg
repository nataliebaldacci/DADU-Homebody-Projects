<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- Grid outer border -->
    <g>
      <rect fill="#3A5566" x="1" y="1" width="19" height="19" rx="1"/>
      <rect fill="#F5F5F0" x="2.2" y="2.2" width="16.6" height="16.6" rx="0.4"/>
    </g>
    <!-- Grid dividers -->
    <g>
      <rect fill="#3A5566" x="10" y="2.2" width="1.2" height="16.6"/>
      <rect fill="#3A5566" x="2.2" y="10" width="16.6" height="1.2"/>
    </g>
    <!-- Zone fills (different densities suggest different zones) -->
    <g>
      <!-- Top-left zone: dense dots -->
      <circle fill="#3A5566" cx="5" cy="5" r="0.6"/>
      <circle fill="#3A5566" cx="7.5" cy="5" r="0.6"/>
      <circle fill="#3A5566" cx="5" cy="7.5" r="0.6"/>
      <circle fill="#3A5566" cx="7.5" cy="7.5" r="0.6"/>
    </g>
    <g>
      <!-- Top-right zone: hatching lines -->
      <rect fill="#3A5566" x="12.5" y="3.5" width="4.5" height="0.7" rx="0.2"/>
      <rect fill="#3A5566" x="12.5" y="5.5" width="4.5" height="0.7" rx="0.2"/>
      <rect fill="#3A5566" x="12.5" y="7.5" width="4.5" height="0.7" rx="0.2"/>
    </g>
    <g>
      <!-- Bottom-left zone: cross pattern -->
      <rect fill="#3A5566" x="3.5" y="13" width="5" height="0.7" rx="0.2"/>
      <rect fill="#3A5566" x="3.5" y="15.5" width="5" height="0.7" rx="0.2"/>
      <rect fill="#3A5566" x="5.5" y="12" width="0.7" height="5.5" rx="0.2"/>
    </g>
    <g>
      <!-- Bottom-right zone: single large shape -->
      <rect fill="#3A5566" x="12.5" y="12.5" width="5" height="5" rx="0.8" opacity="0.5"/>
    </g>
    <!-- Dots (subtle, top-right) -->
    <g>
      <circle fill="#7B746D" cx="22" cy="2" r="0.9"/>
      <circle fill="#7B746D" cx="25" cy="2" r="0.7"/>
      <circle fill="#7B746D" cx="22" cy="5" r="0.7"/>
      <circle fill="#7B746D" cx="25" cy="5" r="0.5"/>
    </g>
  </g>
</svg>
