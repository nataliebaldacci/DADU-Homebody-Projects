<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- Clipboard board -->
    <g>
      <rect fill="#3A5566" x="3" y="3" width="16" height="22" rx="1.2"/>
      <rect fill="#F5F5F0" x="4.5" y="5" width="13" height="18.5" rx="0.5"/>
    </g>
    <!-- Clipboard clip -->
    <g>
      <rect fill="#3A5566" x="7.5" y="1.5" width="7" height="3.5" rx="1"/>
    </g>
    <!-- Check item 1 (checked) -->
    <g>
      <rect fill="#3A5566" x="6" y="7.5" width="3" height="3" rx="0.4"/>
      <polyline fill="none" stroke="#F5F5F0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" points="6.8,9 7.5,9.8 8.5,8.2"/>
      <rect fill="#3A5566" x="10.5" y="8.2" width="5.5" height="1.2" rx="0.3"/>
    </g>
    <!-- Check item 2 (checked) -->
    <g>
      <rect fill="#3A5566" x="6" y="12.5" width="3" height="3" rx="0.4"/>
      <polyline fill="none" stroke="#F5F5F0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" points="6.8,14 7.5,14.8 8.5,13.2"/>
      <rect fill="#3A5566" x="10.5" y="13.2" width="5.5" height="1.2" rx="0.3"/>
    </g>
    <!-- Check item 3 (unchecked) -->
    <g>
      <rect fill="none" stroke="#3A5566" stroke-width="1" x="6.5" y="18" width="2" height="2" rx="0.3"/>
      <rect fill="#3A5566" x="10.5" y="18.2" width="5.5" height="1.2" rx="0.3"/>
    </g>
    <!-- Dots (subtle, top-right) -->
    <g>
      <circle fill="#7B746D" cx="22" cy="2" r="0.9"/>
      <circle fill="#7B746D" cx="25" cy="2" r="0.7"/>
      <circle fill="#7B746D" cx="22" cy="5" r="0.7"/>
      <circle fill="#7B746D" cx="25" cy="5" r="0.5"/>
    </g>
  </g>
</svg>
