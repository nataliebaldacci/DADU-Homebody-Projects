<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- Map/parcel boundary -->
    <path fill="#3A5566" d="M1,4 L19,1 L20,24 L2,27 Z" opacity="0.15"/>
    <path fill="none" stroke="#3A5566" stroke-width="1.5" stroke-linejoin="round" d="M1,4 L19,1 L20,24 L2,27 Z"/>
    <!-- Parcel division -->
    <line x1="10" y1="2.5" x2="11" y2="25.5" stroke="#3A5566" stroke-width="0.8" stroke-dasharray="2,1.5" opacity="0.4"/>

    <!-- Main house (larger) -->
    <g>
      <polygon fill="#3A5566" points="5,11 10,7 15,11"/>
      <rect fill="#3A5566" x="6" y="10.5" width="8" height="7" rx="0.3"/>
      <rect fill="#F5F5F0" x="7" y="12" width="2.5" height="2" rx="0.2"/>
      <rect fill="#F5F5F0" x="10.5" y="12" width="2.5" height="2" rx="0.2"/>
      <rect fill="#F5F5F0" x="8.5" y="14.5" width="3" height="3" rx="0.2"/>
    </g>

    <!-- DADU (smaller, behind/beside) -->
    <g>
      <polygon fill="#3A5566" points="13,18 16,15.5 19,18"/>
      <rect fill="#3A5566" x="13.5" y="17.5" width="5" height="4.5" rx="0.3"/>
      <rect fill="#F5F5F0" x="14.3" y="18.5" width="1.5" height="1.5" rx="0.2"/>
      <rect fill="#F5F5F0" x="16.5" y="18.5" width="1.5" height="1.5" rx="0.2"/>
    </g>

    <!-- Dots as map data points -->
    <circle fill="#7B746D" cx="4" cy="22" r="0.9"/>
    <circle fill="#7B746D" cx="7" cy="24" r="1.0"/>
    <circle fill="#7B746D" cx="15" cy="5" r="0.7"/>
    <circle fill="#7B746D" cx="3" cy="8" r="0.6"/>
    <circle fill="#7B746D" cx="17" cy="10" r="0.8"/>

    <!-- Diminishing dot column 1 -->
    <circle fill="#7B746D" cx="23.5" cy="6" r="1.05"/>
    <circle fill="#7B746D" cx="23.5" cy="10" r="0.87"/>
    <circle fill="#7B746D" cx="23.5" cy="13.5" r="0.69"/>
    <circle fill="#7B746D" cx="23.5" cy="16.5" r="0.51"/>

    <!-- Diminishing dot column 2 -->
    <circle fill="#7B746D" cx="26.5" cy="8" r="0.87"/>
    <circle fill="#7B746D" cx="26.5" cy="11.5" r="0.69"/>
    <circle fill="#7B746D" cx="26.5" cy="14.5" r="0.51"/>
    <circle fill="#7B746D" cx="26.5" cy="17" r="0.38"/>
  </g>
</svg>