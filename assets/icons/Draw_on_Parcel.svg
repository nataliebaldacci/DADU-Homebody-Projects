<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <g>
    <!-- Parcel/lot outline (dashed boundary) -->
    <rect fill="none" stroke="#3A5566" stroke-width="1.5" x="1.5" y="4" width="18" height="18" rx="0.5" stroke-dasharray="3,1.5"/>
    <!-- Dot texture inside parcel (where yard/space would be) -->
    <g>
      <circle fill="#7B746D" cx="4" cy="7" r="0.4"/>
      <circle fill="#7B746D" cx="7" cy="7" r="0.35"/>
      <circle fill="#7B746D" cx="15" cy="7" r="0.4"/>
      <circle fill="#7B746D" cx="4" cy="10" r="0.35"/>
      <circle fill="#7B746D" cx="16" cy="10" r="0.35"/>
      <circle fill="#7B746D" cx="4" cy="18" r="0.35"/>
      <circle fill="#7B746D" cx="16" cy="18" r="0.4"/>
    </g>
    <!-- DADU footprint drawn on parcel -->
    <g>
      <rect fill="#3A5566" x="5.5" y="10" width="10" height="7.5" rx="0.5"/>
      <rect fill="#F5F5F0" x="7" y="11.3" width="7" height="5" rx="0.3"/>
    </g>
    <!-- Dimension arrows below footprint -->
    <g>
      <rect fill="#3A5566" x="5.5" y="19.2" width="10" height="0.6" rx="0.2"/>
      <path fill="#3A5566" d="M5.5,18.5 L5.5,20.3 L3.8,19.4 Z"/>
      <path fill="#3A5566" d="M15.5,18.5 L15.5,20.3 L17.2,19.4 Z"/>
    </g>
    <!-- Pencil -->
    <g>
      <rect fill="#3A5566" x="17" y="1" width="2.5" height="11" rx="0.4" transform="rotate(25,18.25,6.5)"/>
      <path fill="#3A5566" d="M22,14 L24,16.5 L20,16.5 Z" transform="rotate(25,22,15)"/>
    </g>
  </g>
</svg>