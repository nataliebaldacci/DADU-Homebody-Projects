<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 40 40">
  <defs>
    <clipPath id="lens">
      <circle cx="17" cy="17" r="13.5"/>
    </clipPath>
  </defs>

  <!-- Magnifying glass lens border -->
  <circle fill="none" stroke="#3A5566" stroke-width="2.5" cx="17" cy="17" r="13.5"/>

  <!-- Content inside lens (clipped) -->
  <g clip-path="url(#lens)">
    <!-- White background inside lens -->
    <circle fill="#F5F5F0" cx="17" cy="17" r="13.5"/>

    <!-- Parcel division lines -->
    <line x1="4" y1="20" x2="30" y2="13" stroke="#3A5566" stroke-width="0.8" opacity="0.35"/>
    <line x1="12" y1="4" x2="20" y2="31" stroke="#3A5566" stroke-width="0.8" opacity="0.35"/>
    <line x1="4" y1="28" x2="30" y2="22" stroke="#3A5566" stroke-width="0.8" opacity="0.35"/>

    <!-- Main house (ADU logo style - slate, front/left) -->
    <g transform="translate(6, 8)">
      <!-- Roof overhang outline -->
      <polygon fill="#3A5566" points="6,-1.5 13,5 -1,5"/>
      <!-- Roof inner (white gap) -->
      <polygon fill="#F5F5F0" points="6,0.5 11,4.5 1,4.5"/>
      <!-- Roof fill -->
      <polygon fill="#3A5566" points="6,1.5 10.5,4.5 1.5,4.5"/>
      <!-- House body -->
      <rect fill="#3A5566" x="1" y="4.5" width="10" height="9" rx="0"/>
      <!-- Arched door cutout -->
      <rect fill="#F5F5F0" x="4" y="9" width="4" height="4.5" rx="2"/>
    </g>

    <!-- DADU (ADU logo style - warm stone, back/right, slightly larger) -->
    <g transform="translate(15, 5)">
      <!-- Chimney -->
      <rect fill="#7B746D" x="9" y="1" width="2" height="4"/>
      <!-- Roof overhang outline -->
      <polygon fill="#7B746D" points="7,-1.5 14.5,5.5 -0.5,5.5"/>
      <!-- Roof inner (white gap) -->
      <polygon fill="#F5F5F0" points="7,0.5 13,5 1,5"/>
      <!-- Roof fill -->
      <polygon fill="#7B746D" points="7,1.5 12.5,5 1.5,5"/>
      <!-- House body -->
      <rect fill="#7B746D" x="1" y="5" width="12" height="11" rx="0"/>
      <!-- Arched door cutout -->
      <rect fill="#F5F5F0" x="4.5" y="10.5" width="5" height="5.5" rx="2.5"/>
    </g>

    <!-- Dots as map data points -->
    <circle fill="#7B746D" cx="7" cy="22" r="0.9"/>
    <circle fill="#7B746D" cx="10" cy="25" r="1.1"/>
    <circle fill="#7B746D" cx="14" cy="24" r="0.8"/>
    <circle fill="#7B746D" cx="12" cy="27" r="0.7"/>
    <circle fill="#7B746D" cx="7" cy="18" r="0.6"/>
    <circle fill="#7B746D" cx="25" cy="23" r="1.0"/>
    <circle fill="#7B746D" cx="27" cy="19" r="0.8"/>
    <circle fill="#7B746D" cx="20" cy="26" r="0.9"/>
  </g>

  <!-- Magnifying glass handle -->
  <line x1="27" y1="27" x2="37" y2="37" stroke="#3A5566" stroke-width="3.5" stroke-linecap="round"/>
</svg>
